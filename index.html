<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>עוזר תמיכה הנדסי</title>
<style>
  :root{
    --bg:#12181f;
    --panel:#1a2229;
    --panel2:#212b34;
    --line:#2c3641;
    --text:#e8ecef;
    --dim:#8a97a3;
    --amber:#e8a33d;
    --amber-dim:#7a5a24;
    --cyan:#3ddcc7;
    --red:#e8593d;
    --mono:'IBM Plex Mono','Consolas','Courier New',monospace;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI','Arial',sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    display:flex;
    flex-direction:column;
    height:100vh;
    overflow:hidden;
  }
  /* header */
  header{
    background:var(--panel);
    border-bottom:1px solid var(--line);
    padding:10px 14px;
    display:flex;
    align-items:center;
    gap:10px;
    flex-shrink:0;
  }
  .lamp{
    width:10px;height:10px;border-radius:50%;
    background:var(--dim);
    box-shadow:0 0 0 2px rgba(255,255,255,0.03);
    flex-shrink:0;
    transition:background .3s, box-shadow .3s;
  }
  .lamp.ready{background:var(--cyan);box-shadow:0 0 8px var(--cyan);}
  .lamp.busy{background:var(--amber);box-shadow:0 0 8px var(--amber);animation:pulse 1s infinite;}
  .lamp.err{background:var(--red);box-shadow:0 0 8px var(--red);}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
  header h1{
    font-size:15px;margin:0;letter-spacing:.3px;font-weight:600;flex:1;
  }
  header .status{
    font-family:var(--mono);
    font-size:10.5px;
    color:var(--dim);
    white-space:nowrap;
  }
  /* tabs */
  nav.tabs{
    display:flex;
    background:var(--panel);
    border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  nav.tabs button{
    flex:1;
    background:none;
    border:none;
    color:var(--dim);
    font-family:var(--sans);
    font-size:13px;
    padding:11px 6px;
    cursor:pointer;
    border-bottom:2px solid transparent;
    transition:color .15s,border-color .15s;
  }
  nav.tabs button.active{
    color:var(--amber);
    border-bottom-color:var(--amber);
  }
  main{flex:1;overflow:hidden;display:flex;flex-direction:column;position:relative;}
  .view{display:none;flex:1;overflow:hidden;flex-direction:column;}
  .view.active{display:flex;}

  /* chat view */
  #chatLog{
    flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;
  }
  .msg{max-width:86%;padding:10px 13px;border-radius:12px;font-size:14px;line-height:1.55;white-space:pre-wrap;}
  .msg.user{align-self:flex-start;background:var(--panel2);border:1px solid var(--line);}
  .msg.bot{align-self:flex-end;background:linear-gradient(180deg,#22303a,#1b262e);border:1px solid var(--amber-dim);}
  .msg .src{
    margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);
    font-family:var(--mono);font-size:11px;color:var(--dim);
  }
  .msg .src b{color:var(--cyan);}
  .msg.empty-state{align-self:center;color:var(--dim);text-align:center;background:none;border:none;font-size:13px;}
  #chatForm{
    display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);background:var(--panel);flex-shrink:0;
  }
  #chatInput{
    flex:1;background:var(--bg);border:1px solid var(--line);border-radius:10px;
    color:var(--text);padding:11px 12px;font-family:var(--sans);font-size:14px;resize:none;
  }
  #chatInput:focus{outline:none;border-color:var(--amber);}
  #chatForm button{
    background:var(--amber);color:#1a1204;border:none;border-radius:10px;
    padding:0 18px;font-weight:700;font-size:14px;cursor:pointer;
  }
  #chatForm button:disabled{background:var(--line);color:var(--dim);cursor:not-allowed;}

  /* admin view */
  #adminView{overflow-y:auto;padding:14px;gap:18px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px;}
  .card h2{font-size:13px;margin:0 0 10px;color:var(--amber);letter-spacing:.3px;display:flex;align-items:center;gap:6px;}
  .card h2 .n{font-family:var(--mono);color:var(--dim);font-size:11px;}
  label{display:block;font-size:12px;color:var(--dim);margin:8px 0 4px;}
  input[type=text],textarea{
    width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;
    color:var(--text);padding:9px 10px;font-family:var(--sans);font-size:13.5px;
  }
  textarea{resize:vertical;min-height:70px;line-height:1.5;}
  input:focus,textarea:focus{outline:none;border-color:var(--cyan);}
  .row{display:flex;gap:8px;}
  .row>*{flex:1;}
  .btn{
    background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;
    padding:9px 14px;font-size:13px;cursor:pointer;margin-top:10px;
  }
  .btn.primary{background:var(--amber);color:#1a1204;border-color:var(--amber);font-weight:700;}
  .btn.danger{color:var(--red);}
  .btn:active{transform:scale(.98);}
  .list-item{
    border-top:1px solid var(--line);padding:10px 0;font-size:13px;
  }
  .list-item .t{font-weight:600;margin-bottom:3px;}
  .list-item .p{color:var(--dim);font-size:12px;white-space:pre-wrap;max-height:60px;overflow:hidden;}
  .list-item .meta{display:flex;justify-content:space-between;align-items:center;margin-top:6px;}
  .badge{font-family:var(--mono);font-size:10px;color:var(--cyan);background:#123;padding:2px 6px;border-radius:4px;}
  .del{background:none;border:none;color:var(--red);font-size:12px;cursor:pointer;}
  .hint{font-size:11.5px;color:var(--dim);line-height:1.6;margin-top:4px;}
  .toolbar{display:flex;gap:8px;margin-bottom:10px;}
  .toolbar .btn{margin-top:0;flex:1;text-align:center;}
  #fileImport{display:none;}
</style>
</head>
<body>

<header>
  <div id="lamp" class="lamp"></div>
  <h1>עוזר תמיכה הנדסי</h1>
  <div id="statusText" class="status">טוען מודל...</div>
</header>

<nav class="tabs">
  <button data-view="chatView" class="active">💬 צ'אט</button>
  <button data-view="adminView">🗂 ניהול ידע</button>
</nav>

<main>
  <section id="chatView" class="view active">
    <div id="chatLog">
      <div class="msg empty-state">שאל אותי שאלה הנדסית. אני אחפש קודם ב-Q&amp;A שהזנת, ואז בנהלים/תקנים שהעלית.</div>
    </div>
    <form id="chatForm">
      <textarea id="chatInput" rows="1" placeholder="הקלד שאלה..." dir="rtl"></textarea>
      <button type="submit" id="sendBtn" disabled>שלח</button>
    </form>
  </section>

  <section id="adminView" class="view">
    <div class="card">
      <div class="toolbar">
        <button class="btn" id="exportBtn">⬇ ייצוא מאגר</button>
        <button class="btn" id="importBtn">⬆ ייבוא מאגר</button>
        <input type="file" id="fileImport" accept="application/json">
      </div>
      <div class="hint">כל הידע נשמר מקומית בדפדפן (localStorage). ייצוא/ייבוא מאפשר גיבוי או העברה בין מכשירים.</div>
    </div>

    <div class="card">
      <h2>נהלים ותקנים <span class="n" id="docCount">(0)</span></h2>
      <label>כותרת המסמך</label>
      <input type="text" id="docTitle" placeholder="לדוגמה: IPC-A-620 סעיף 4 - קרימפ">
      <label>תוכן (טקסט חופשי - יפוצל אוטומטית לקטעים)</label>
      <textarea id="docText" rows="6" placeholder="הדבק כאן את הנוהל/התקן..." dir="rtl"></textarea>
      <button class="btn primary" id="addDocBtn">➕ הוסף למאגר ובצע הטמעה (embedding)</button>
      <div class="hint" id="docProgress"></div>
      <div id="docList"></div>
    </div>

    <div class="card">
      <h2>שאלות ותשובות <span class="n" id="qaCount">(0)</span></h2>
      <label>שאלה</label>
      <input type="text" id="qaQ" placeholder="לדוגמה: מה מומנט ההידוק לברגי M4?">
      <label>תשובה</label>
      <textarea id="qaA" rows="3" placeholder="התשובה המדויקת..." dir="rtl"></textarea>
      <button class="btn primary" id="addQaBtn">➕ הוסף שאלה-תשובה</button>
      <div id="qaList"></div>
    </div>
  </section>
</main>

<script type="module">
import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1';

// keep everything local-cache friendly; allow remote fetch only for the one-time model download
env.allowLocalModels = false;

const LS_DOCS = 'esb_docs_v1';
const LS_QA = 'esb_qa_v1';

let extractor = null;
let docs = JSON.parse(localStorage.getItem(LS_DOCS) || '[]');
let qa = JSON.parse(localStorage.getItem(LS_QA) || '[]');

const lamp = document.getElementById('lamp');
const statusText = document.getElementById('statusText');
const sendBtn = document.getElementById('sendBtn');
const chatInput = document.getElementById('chatInput');
const chatLog = document.getElementById('chatLog');

function setStatus(mode, text){
  lamp.className = 'lamp ' + mode;
  statusText.textContent = text;
}

async function initModel(){
  try{
    setStatus('busy', 'מוריד מודל (חד-פעמי, נדרש אינטרנט)...');
    extractor = await pipeline('feature-extraction', 'Xenova/all-MiniLM-L6-v2', { quantized: true });
    setStatus('ready', 'מוכן • המודל שמור במטמון לשימוש אופליין');
    sendBtn.disabled = false;
  }catch(e){
    console.error(e);
    setStatus('err', 'שגיאה בטעינת המודל - בדוק חיבור אינטרנט (רק בפעם הראשונה)');
  }
}
initModel();

async function embed(text){
  const out = await extractor(text, { pooling: 'mean', normalize: true });
  return Array.from(out.data);
}

function cosine(a, b){
  let s = 0;
  for(let i=0;i<a.length;i++) s += a[i]*b[i];
  return s; // already normalized -> dot product = cosine similarity
}

function chunkText(text){
  // split into paragraphs, then group into ~250-450 char chunks
  const paras = text.split(/\n+/).map(p=>p.trim()).filter(Boolean);
  const chunks = [];
  let buf = '';
  for(const p of paras){
    if((buf + ' ' + p).length > 450 && buf){
      chunks.push(buf.trim());
      buf = p;
    } else {
      buf = buf ? buf + ' ' + p : p;
    }
  }
  if(buf) chunks.push(buf.trim());
  return chunks.length ? chunks : [text.trim()];
}

function saveDocs(){ localStorage.setItem(LS_DOCS, JSON.stringify(docs)); renderDocs(); }
function saveQa(){ localStorage.setItem(LS_QA, JSON.stringify(qa)); renderQa(); }

function renderDocs(){
  document.getElementById('docCount').textContent = `(${docs.length})`;
  const el = document.getElementById('docList');
  el.innerHTML = docs.map(d => `
    <div class="list-item">
      <div class="t">${escapeHtml(d.title)}</div>
      <div class="p">${escapeHtml(d.chunks.map(c=>c.text).join(' ')).slice(0,180)}...</div>
      <div class="meta">
        <span class="badge">${d.chunks.length} קטעים</span>
        <button class="del" data-del-doc="${d.id}">מחק</button>
      </div>
    </div>`).join('');
  el.querySelectorAll('[data-del-doc]').forEach(b=>{
    b.onclick = ()=>{ docs = docs.filter(d=>d.id!==b.dataset.delDoc); saveDocs(); };
  });
}

function renderQa(){
  document.getElementById('qaCount').textContent = `(${qa.length})`;
  const el = document.getElementById('qaList');
  el.innerHTML = qa.map(item => `
    <div class="list-item">
      <div class="t">${escapeHtml(item.q)}</div>
      <div class="p">${escapeHtml(item.a)}</div>
      <div class="meta">
        <span class="badge">Q&amp;A</span>
        <button class="del" data-del-qa="${item.id}">מחק</button>
      </div>
    </div>`).join('');
  el.querySelectorAll('[data-del-qa]').forEach(b=>{
    b.onclick = ()=>{ qa = qa.filter(x=>x.id!==b.dataset.delQa); saveQa(); };
  });
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ---- Add document ----
document.getElementById('addDocBtn').onclick = async () => {
  const title = document.getElementById('docTitle').value.trim();
  const text = document.getElementById('docText').value.trim();
  if(!title || !text) return alert('נא למלא כותרת ותוכן');
  if(!extractor) return alert('המודל עדיין לא מוכן, המתן רגע');
  const progress = document.getElementById('docProgress');
  const rawChunks = chunkText(text);
  const chunks = [];
  for(let i=0;i<rawChunks.length;i++){
    progress.textContent = `מטמיע קטע ${i+1}/${rawChunks.length}...`;
    const vec = await embed(rawChunks[i]);
    chunks.push({ text: rawChunks[i], vec });
  }
  docs.push({ id: crypto.randomUUID(), title, chunks });
  saveDocs();
  document.getElementById('docTitle').value = '';
  document.getElementById('docText').value = '';
  progress.textContent = 'בוצע ✓';
  setTimeout(()=>progress.textContent='', 1500);
};

// ---- Add Q&A ----
document.getElementById('addQaBtn').onclick = async () => {
  const q = document.getElementById('qaQ').value.trim();
  const a = document.getElementById('qaA').value.trim();
  if(!q || !a) return alert('נא למלא שאלה ותשובה');
  if(!extractor) return alert('המודל עדיין לא מוכן, המתן רגע');
  const vec = await embed(q);
  qa.push({ id: crypto.randomUUID(), q, a, vec });
  saveQa();
  document.getElementById('qaQ').value = '';
  document.getElementById('qaA').value = '';
};

// ---- Export / Import ----
document.getElementById('exportBtn').onclick = () => {
  const blob = new Blob([JSON.stringify({docs, qa}, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'eng-support-kb.json'; a.click();
  URL.revokeObjectURL(url);
};
document.getElementById('importBtn').onclick = () => document.getElementById('fileImport').click();
document.getElementById('fileImport').onchange = async (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const text = await file.text();
  try{
    const data = JSON.parse(text);
    if(Array.isArray(data.docs)) docs = docs.concat(data.docs);
    if(Array.isArray(data.qa)) qa = qa.concat(data.qa);
    saveDocs(); saveQa();
    alert('הייבוא הושלם');
  }catch(err){ alert('קובץ לא תקין'); }
};

// ---- Chat ----
document.getElementById('chatForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const q = chatInput.value.trim();
  if(!q || !extractor) return;
  addMsg(q, 'user');
  chatInput.value = '';
  sendBtn.disabled = true;
  setStatus('busy', 'מחפש...');

  const qVec = await embed(q);

  // score QA
  let bestQa = null, bestQaScore = -1;
  for(const item of qa){
    const s = cosine(qVec, item.vec);
    if(s > bestQaScore){ bestQaScore = s; bestQa = item; }
  }

  // score doc chunks
  let bestChunks = [];
  for(const d of docs){
    for(const c of d.chunks){
      const s = cosine(qVec, c.vec);
      bestChunks.push({ score: s, text: c.text, title: d.title });
    }
  }
  bestChunks.sort((a,b)=>b.score-a.score);
  bestChunks = bestChunks.slice(0,2);

  renderAnswer(bestQa, bestQaScore, bestChunks);
  setStatus('ready', 'מוכן');
  sendBtn.disabled = false;
});

// auto-resize textarea
chatInput.addEventListener('input', () => {
  chatInput.style.height = 'auto';
  chatInput.style.height = Math.min(chatInput.scrollHeight, 120) + 'px';
});
chatInput.addEventListener('keydown', (e) => {
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    document.getElementById('chatForm').requestSubmit();
  }
});

function addMsg(text, cls, srcHtml){
  const empty = chatLog.querySelector('.empty-state');
  if(empty) empty.remove();
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.innerHTML = escapeHtml(text).replace(/\n/g,'<br>') + (srcHtml || '');
  chatLog.appendChild(div);
  chatLog.scrollTop = chatLog.scrollHeight;
}

function renderAnswer(bestQa, bestQaScore, bestChunks){
  const QA_THRESHOLD = 0.62;
  const DOC_THRESHOLD = 0.35;

  if(!qa.length && !docs.length){
    addMsg('המאגר שלי ריק כרגע. עבור ל"ניהול ידע" והוסף נהלים או שאלות-תשובות כדי שאוכל לעזור.', 'bot');
    return;
  }

  if(bestQa && bestQaScore >= QA_THRESHOLD){
    const src = `<div class="src"><b>מקור:</b> Q&amp;A • התאמה ${(bestQaScore*100).toFixed(0)}%</div>`;
    addMsg(bestQa.a, 'bot', src);
    return;
  }

  const relevant = bestChunks.filter(c => c.score >= DOC_THRESHOLD);
  if(relevant.length){
    let answer = relevant.map(c => c.text).join('\n\n');
    let src = '<div class="src">';
    relevant.forEach(c => {
      src += `<b>מקור:</b> ${escapeHtml(c.title)} • התאמה ${(c.score*100).toFixed(0)}%<br>`;
    });
    src += '</div>';
    addMsg(answer, 'bot', src);
    return;
  }

  addMsg('לא מצאתי תשובה מספקת מהימנה במאגר. נסה לנסח אחרת, או הוסף את המידע הזה ב"ניהול ידע".', 'bot');
}

// ---- Tabs ----
document.querySelectorAll('nav.tabs button').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.view).classList.add('active');
  };
});

// initial render
renderDocs();
renderQa();
</script>
</body>
</html>
