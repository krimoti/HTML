<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>עורך שרטוטים ועדכוני מדבקות - Offline Studio</title>
    <!-- Fabric.js library for Canvas manipulation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <style>
        :root {
            --bg-color: #1e1e2e;
            --panel-bg: #2b2b3d;
            --accent-color: #007acc;
            --text-color: #f3f3f3;
            --border-color: #44445e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { display: flex; height: 100vh; background-color: var(--bg-color); color: var(--text-color); overflow: hidden; }

        /* Sidebar Controls */
        #sidebar {
            width: 320px;
            background: var(--panel-bg);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 15px;
            overflow-y: auto;
        }

        h2, h3 { color: #fff; border-bottom: 2px solid var(--accent-color); padding-bottom: 5px; margin-bottom: 5px; font-size: 1.1rem; }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: #222230;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        label { font-size: 0.85rem; color: #aaa; }
        
        button, input, select {
            padding: 8px 12px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            background: #333348;
            color: #fff;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover { background: var(--accent-color); }
        .btn-danger { background: #b00020; }
        .btn-danger:hover { background: #dc3545; }
        .btn-success { background: #2e7d32; }
        .btn-success:hover { background: #388e3c; }

        .row { display: flex; gap: 8px; }
        .row > * { flex: 1; }

        /* Canvas Workspace Area */
        #workspace {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #12121c;
            overflow: auto;
            position: relative;
            padding: 20px;
        }

        .canvas-container-wrapper {
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            background: #ffffff;
        }

        /* Status bar */
        #status {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <!-- Workspace Panel -->
    <div id="workspace">
        <div class="canvas-container-wrapper">
            <canvas id="drawingCanvas"></canvas>
        </div>
        <div id="status">מצב: מוכן | גודל: A4 לרוחב (842x595px)</div>
    </div>

    <!-- Right Controls Sidebar -->
    <div id="sidebar">
        <h2>🛠️ כלי שרטוט ותבניות</h2>

        <!-- Templates -->
        <div class="control-group">
            <h3>תבניות בסיס</h3>
            <button onclick="loadTemplateA4()">📄 תבנית A4 הנדסית (Title Block)</button>
            <button onclick="addSampleLabel()">🏷️ הוסף מדבקת דוגמה (Nameplate)</button>
        </div>

        <!-- Element Insertion -->
        <div class="control-group">
            <h3>הוספת אלמנטים</h3>
            <div class="row">
                <button onclick="addText()">📝 טקסט</button>
                <button onclick="addBox()">🔲 מלבן</button>
            </div>
            <div class="row">
                <button onclick="addArrow()">➡️ חץ / Leader</button>
                <button onclick="addLine()">➖ קו ישר</button>
            </div>
            <label for="imageLoader">📷 העלאת תמונה/לוגו:</label>
            <input type="file" id="imageLoader" accept="image/*">
        </div>

        <!-- Object Properties -->
        <div class="control-group">
            <h3>מאפייני אלמנט נבחר</h3>
            <div class="row">
                <label>צבע מילוי: <input type="color" id="fillColor" onchange="updateObjectProperty('fill', this.value)"></label>
                <label>צבע מסגרת: <input type="color" id="strokeColor" onchange="updateObjectProperty('stroke', this.value)"></label>
            </div>
            <div class="row">
                <label>עובי קו: <input type="number" id="strokeWidth" min="1" max="10" value="2" onchange="updateObjectProperty('strokeWidth', parseInt(this.value))"></label>
                <label>שקיפות: <input type="range" id="opacity" min="0.1" max="1" step="0.1" value="1" onchange="updateObjectProperty('opacity', parseFloat(this.value))"></label>
            </div>
            <div class="row">
                <button onclick="bringToFront()">⬆️ הבא לחזית</button>
                <button onclick="sendToBack()">⬇️ שלח לאחור</button>
            </div>
            <button class="btn-danger" onclick="deleteSelected()">🗑️ מחק אלמנט נבחר</button>
        </div>

        <!-- Project Actions -->
        <div class="control-group">
            <h3>שמירה וייצוא</h3>
            <button class="btn-success" onclick="exportToPNG()">🖼️ ייצא לתמונה (PNG)</button>
            <div class="row">
                <button onclick="saveProjectJSON()">💾 שמור פרויקט (JSON)</button>
                <button onclick="document.getElementById('jsonLoader').click()">📂 טען פרויקט</button>
            </div>
            <input type="file" id="jsonLoader" accept=".json" style="display:none;" onchange="loadProjectJSON(event)">
            <button class="btn-danger" onclick="clearCanvas()">⚠️ נקה משטח עבודה</button>
        </div>
    </div>

    <script>
        // Setup Fabric.js Canvas with A4 Landscape Ratio (approx 842x595 pixels at 72DPI)
        const CANVAS_WIDTH = 842;
        const CANVAS_HEIGHT = 595;

        const canvas = new fabric.Canvas('drawingCanvas', {
            width: CANVAS_WIDTH,
            height: CANVAS_HEIGHT,
            backgroundColor: '#ffffff',
            selection: true
        });

        // Initialize Base Template
        window.onload = () => {
            loadTemplateA4();
        };

        // 1. Technical Drawing A4 Border & Title Block Template
        function loadTemplateA4() {
            canvas.clear();
            canvas.setBackgroundColor('#ffffff', canvas.renderAll.bind(canvas));

            // Outer Border
            const outerRect = new fabric.Rect({
                left: 15, top: 15, width: CANVAS_WIDTH - 30, height: CANVAS_HEIGHT - 30,
                fill: 'transparent', stroke: '#000000', strokeWidth: 2, selectable: false
            });

            // Revision Block (Top Right)
            const revBlock = new fabric.Group([
                new fabric.Rect({ width: 340, height: 80, fill: 'transparent', stroke: '#000', strokeWidth: 1 }),
                new fabric.Line([0, 20, 340, 20], { stroke: '#000', strokeWidth: 1 }),
                new fabric.Line([0, 40, 340, 40], { stroke: '#000', strokeWidth: 1 }),
                new fabric.Line([0, 60, 340, 60], { stroke: '#000', strokeWidth: 1 }),
                new fabric.Line([35, 0, 35, 80], { stroke: '#000', strokeWidth: 1 }),
                new fabric.Line([200, 0, 200, 80], { stroke: '#000', strokeWidth: 1 }),
                new fabric.Line([240, 0, 240, 80], { stroke: '#000', strokeWidth: 1 }),
                new fabric.Line([295, 0, 295, 80], { stroke: '#000', strokeWidth: 1 }),
                // Header Text
                new fabric.Text('REV', { left: 5, top: 4, fontSize: 10, fontFamily: 'Arial', fontWeight: 'bold' }),
                new fabric.Text('DESCRIPTION', { left: 70, top: 4, fontSize: 10, fontFamily: 'Arial', fontWeight: 'bold' }),
                new fabric.Text('ECO', { left: 205, top: 4, fontSize: 10, fontFamily: 'Arial', fontWeight: 'bold' }),
                new fabric.Text('DATE', { left: 250, top: 4, fontSize: 10, fontFamily: 'Arial', fontWeight: 'bold' }),
                new fabric.Text('APPROVED', { left: 298, top: 4, fontSize: 10, fontFamily: 'Arial', fontWeight: 'bold' }),
                // Row 0
                new fabric.Text('0', { left: 14, top: 24, fontSize: 10, fontFamily: 'Arial' }),
                new fabric.Text('DEVICE NAMEPLATE', { left: 40, top: 24, fontSize: 10, fontFamily: 'Arial' }),
                new fabric.Text('07.05.25', { left: 245, top: 24, fontSize: 10, fontFamily: 'Arial' }),
                new fabric.Text('Moti K.', { left: 300, top: 24, fontSize: 10, fontFamily: 'Arial' }),
            ], { left: CANVAS_WIDTH - 365, top: 25, selectable: true });

            // Title Block (Bottom Right)
            const titleBlock = new fabric.Group([
                new fabric.Rect({ width: 230, height: 90, fill: 'transparent', stroke: '#000', strokeWidth: 1.5 }),
                new fabric.Line([0, 25, 230, 25], { stroke: '#000', strokeWidth: 1 }),
                new fabric.Line([0, 55, 230, 55], { stroke: '#000', strokeWidth: 1 }),
                new fabric.Line([0, 70, 180, 70], { stroke: '#000', strokeWidth: 1 }),
                new fabric.Line([180, 55, 180, 90], { stroke: '#000', strokeWidth: 1 }),
                // Text Fields
                new fabric.Text('Amphenol Tel-ad', { left: 65, top: 5, fontSize: 12, fontFamily: 'Arial', fontWeight: 'bold' }),
                new fabric.Text('TITLE:', { left: 5, top: 30, fontSize: 8, fontFamily: 'Arial', fill: '#555' }),
                new fabric.Text('Device Nameplate', { left: 40, top: 30, fontSize: 12, fontFamily: 'Arial', fill: '#000088', fontWeight: 'bold' }),
                new fabric.Text('PROJECT:', { left: 5, top: 57, fontSize: 7, fontFamily: 'Arial', fill: '#555' }),
                new fabric.Text('SIZE: A4', { left: 5, top: 74, fontSize: 8, fontFamily: 'Arial' }),
                new fabric.Text('Drawing Number: 11A-NP-02', { left: 50, top: 74, fontSize: 9, fontFamily: 'Arial', fontWeight: 'bold' }),
                new fabric.Text('REV: 2', { left: 190, top: 68, fontSize: 12, fontFamily: 'Arial', fontWeight: 'bold' })
            ], { left: CANVAS_WIDTH - 255, top: CANVAS_HEIGHT - 115, selectable: true });

            canvas.add(outerRect, revBlock, titleBlock);
            canvas.renderAll();
        }

        // 2. Add Nameplate/Label Component Example
        function addSampleLabel() {
            const labelGroup = new fabric.Group([
                new fabric.Rect({ width: 180, height: 60, fill: '#000000', rx: 3, ry: 3 }),
                new fabric.Text('MOTOR#3 ASSEMBLY', { left: 25, top: 8, fontSize: 11, fill: '#ffffff', fontFamily: 'Arial', fontWeight: 'bold' }),
                new fabric.Rect({ left: 38, top: 24, width: 90, height: 14, fill: '#ffffff' }),
                new fabric.Text('P/N:', { left: 10, top: 25, fontSize: 9, fill: '#ffffff', fontFamily: 'Arial' }),
                new fabric.Text('15A-03-0494-01', { left: 40, top: 26, fontSize: 9, fill: '#000000', fontFamily: 'Arial', fontWeight: 'bold' }),
                new fabric.Text('REV', { left: 132, top: 25, fontSize: 8, fill: '#ffffff', fontFamily: 'Arial' }),
                new fabric.Rect({ left: 155, top: 24, width: 18, height: 14, fill: '#ffffff' }),
                new fabric.Text('02', { left: 158, top: 26, fontSize: 9, fill: '#000000', fontFamily: 'Arial', fontWeight: 'bold' }),
                new fabric.Text('S/N:', { left: 10, top: 43, fontSize: 9, fill: '#ffffff', fontFamily: 'Arial' }),
                new fabric.Rect({ left: 38, top: 42, width: 135, height: 14, fill: '#ffffff' }),
                new fabric.Text('ATA-2402001', { left: 65, top: 44, fontSize: 9, fill: '#000000', fontFamily: 'Arial' })
            ], { left: 300, top: 150 });

            canvas.add(labelGroup);
            canvas.setActiveObject(labelGroup);
        }

        // 3. Add Custom Shapes & Callouts
        function addText() {
            const text = new fabric.IText('לחץ פעמיים לעריכה', {
                left: 100, top: 100, fontSize: 14, fontFamily: 'Arial', fill: '#000000'
            });
            canvas.add(text);
            canvas.setActiveObject(text);
        }

        function addBox() {
            const rect = new fabric.Rect({
                left: 120, top: 120, width: 100, height: 60,
                fill: 'transparent', stroke: '#000000', strokeWidth: 1.5
            });
            canvas.add(rect);
        }

        function addLine() {
            const line = new fabric.Line([50, 50, 150, 50], {
                stroke: '#000000', strokeWidth: 1.5
            });
            canvas.add(line);
        }

        function addArrow() {
            // Arrow Line + Triangle Head
            const line = new fabric.Line([0, 0, 80, 0], { stroke: '#000000', strokeWidth: 1.5 });
            const head = new fabric.Triangle({
                left: 0, top: -4, pointLt: {x: 0, y: 0}, width: 8, height: 10, fill: '#000000', angle: -90
            });
            const arrow = new fabric.Group([line, head], { left: 200, top: 200 });
            canvas.add(arrow);
        }

        // Image Loader (RoHS Logos, Diagrams, etc.)
        document.getElementById('imageLoader').addEventListener('change', function(e) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const imgObj = new Image();
                imgObj.src = event.target.result;
                imgObj.onload = function() {
                    const image = new fabric.Image(imgObj);
                    image.scaleToWidth(120);
                    canvas.add(image);
                    canvas.renderAll();
                }
            }
            if (e.target.files[0]) {
                reader.readAsDataURL(e.target.files[0]);
            }
        });

        // 4. Object Properties Manipulation
        function updateObjectProperty(prop, value) {
            const activeObject = canvas.getActiveObject();
            if (activeObject) {
                activeObject.set(prop, value);
                canvas.renderAll();
            }
        }

        function bringToFront() {
            const activeObject = canvas.getActiveObject();
            if (activeObject) activeObject.bringToFront();
        }

        function sendToBack() {
            const activeObject = canvas.getActiveObject();
            if (activeObject) activeObject.sendToBack();
        }

        function deleteSelected() {
            const activeObjects = canvas.getActiveObjects();
            if (activeObjects.length) {
                activeObjects.forEach(obj => canvas.remove(obj));
                canvas.discardActiveObject();
                canvas.renderAll();
            }
        }

        function clearCanvas() {
            if (confirm("האם אתה בטוח שברצונך למחוק את כל משטח העבודה?")) {
                canvas.clear();
            }
        }

        // 5. Save & Export Functions
        function exportToPNG() {
            canvas.discardActiveObject();
            canvas.renderAll();
            const dataURL = canvas.toDataURL({ format: 'png', multiplier: 2 }); // High res export
            const link = document.createElement('a');
            link.download = 'Drawing_Specification.png';
            link.href = dataURL;
            link.click();
        }

        function saveProjectJSON() {
            const json = JSON.stringify(canvas.toJSON());
            const blob = new Blob([json], { type: 'application/json' });
            const link = document.createElement('a');
            link.download = 'Drawing_Project.json';
            link.href = URL.createObjectURL(blob);
            link.click();
        }

        function loadProjectJSON(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(f) {
                canvas.loadFromJSON(f.target.result, canvas.renderAll.bind(canvas));
            };
            reader.readAsText(file);
        }

        // Update control panel values on selection
        canvas.on('selection:created', updateSidebarControls);
        canvas.on('selection:updated', updateSidebarControls);

        function updateSidebarControls() {
            const active = canvas.getActiveObject();
            if (active) {
                if (active.fill && typeof active.fill === 'string') document.getElementById('fillColor').value = active.fill;
                if (active.stroke) document.getElementById('strokeColor').value = active.stroke;
                if (active.strokeWidth) document.getElementById('strokeWidth').value = active.strokeWidth;
                if (active.opacity) document.getElementById('opacity').value = active.opacity;
            }
        }
    </script>
</body>
</html>
