<!DOCTYPE html>
<html lang="he" dir="rtl" data-theme="sky">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>לוח ניהול פרויקט</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Heebo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============ THEME TOKENS ============ */
:root{
  --font-display:'Space Grotesk','Heebo',sans-serif;
  --font-body:'Heebo',sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
  --radius:14px;
  --radius-sm:8px;
  --shadow:0 1px 2px rgba(20,30,45,.06), 0 8px 24px -12px rgba(20,30,45,.18);
}
html[data-theme="sky"]{
  --primary:#0B5FA5; --primary-dark:#083F6E; --primary-light:#4FA8E0;
  --accent:#F0A324; --bg:#F3F8FC; --surface:#FFFFFF; --surface-2:#EAF3FB;
  --text:#16232F; --muted:#5C7189; --border:#D8E4F0; --good:#1E8A5F; --warn:#C77B12; --bad:#C23B3B;
}
html[data-theme="graphite"]{
  --primary:#5B8DEF; --primary-dark:#33507F; --primary-light:#8FB4F5;
  --accent:#F2A93C; --bg:#111820; --surface:#1A222B; --surface-2:#212B35;
  --text:#E8EEF4; --muted:#93A3B5; --border:#2B3945; --good:#4FC28A; --warn:#E3A63D; --bad:#E56464;
}
html[data-theme="forest"]{
  --primary:#1E7A4C; --primary-dark:#134F31; --primary-light:#5CB981;
  --accent:#D98E2A; --bg:#F4FAF5; --surface:#FFFFFF; --surface-2:#E8F4EB;
  --text:#17251C; --muted:#5B6E60; --border:#D2E5D7; --good:#1E7A4C; --warn:#B87A1E; --bad:#C0473F;
}
html[data-theme="sunset"]{
  --primary:#C0562F; --primary-dark:#8A3D20; --primary-light:#E38A5C;
  --accent:#2F7B8C; --bg:#FBF6F1; --surface:#FFFFFF; --surface-2:#F5E9DE;
  --text:#2A2019; --muted:#7C6C5D; --border:#EAD9C8; --good:#3C8A5E; --warn:#C0782B; --bad:#B83E36;
}
html[data-theme="violet"]{
  --primary:#5D3FA6; --primary-dark:#3F2A78; --primary-light:#9078D1;
  --accent:#D9A63C; --bg:#F8F6FC; --surface:#FFFFFF; --surface-2:#EFEAF9;
  --text:#221A31; --muted:#6E6480; --border:#DED3F0; --good:#2E8A5C; --warn:#B87E1E; --bad:#B8433D;
}
html[data-theme="crimson"]{
  --primary:#A6293F; --primary-dark:#74192B; --primary-light:#D65F72;
  --accent:#2C7DA0; --bg:#FBF6F7; --surface:#FFFFFF; --surface-2:#F5E4E7;
  --text:#2A1A1F; --muted:#7C5C61; --border:#EAD3D8; --good:#2E8A5C; --warn:#B87E1E; --bad:#A6293F;
}

*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);transition:background .25s,color .25s;}
.ltr{direction:ltr;unicode-bidi:plaintext;font-family:var(--font-mono);}

/* ============ TOOLBAR ============ */
.toolbar{
  position:sticky;top:0;z-index:60;background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:14px;padding:10px 22px;flex-wrap:wrap;
}
.toolbar .brand{font-family:var(--font-display);font-weight:700;font-size:15px;color:var(--primary);display:flex;align-items:center;gap:8px;margin-inline-end:auto;}
.toolbar .brand svg{width:20px;height:20px;}
.btn{
  border:1px solid var(--border);background:var(--surface);color:var(--text);
  font-family:var(--font-body);font-weight:600;font-size:13px;
  padding:8px 14px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
  transition:.15s;white-space:nowrap;
}
.btn:hover{border-color:var(--primary-light);color:var(--primary);}
.btn.primary{background:var(--primary);color:#fff;border-color:var(--primary);}
.btn.primary:hover{background:var(--primary-dark);color:#fff;}
.btn.active{background:var(--primary);color:#fff;border-color:var(--primary);}
.btn.ghost{border-color:transparent;background:transparent;}
.btn.danger{border-color:var(--bad);color:var(--bad);}
.btn.danger:hover{background:var(--bad);color:#fff;}
.btn:disabled{opacity:.45;cursor:default;}
.btn svg{width:14px;height:14px;flex:none;}
.theme-row{display:flex;align-items:center;gap:6px;padding-inline-start:8px;border-inline-start:1px solid var(--border);}
.swatch{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);}
.swatch.active{border-color:var(--text);transform:scale(1.12);}
input[type=file]{display:none;}
.autosave-group{display:flex;align-items:center;gap:8px;}
.autosave-group select.btn{padding:8px 10px;font-family:var(--font-body);}
.autosave-status{font-size:11.5px;color:var(--muted);font-family:var(--font-mono);white-space:nowrap;}
.autosave-status.ok{color:var(--good);}
.autosave-status.err{color:var(--bad);}
#btnAutoSave.active{background:var(--good);border-color:var(--good);color:#fff;}
#btnAutoSave.active:hover{background:#176b47;border-color:#176b47;color:#fff;}

/* ============ TABS BAR ============ */
.tabs-bar{
  position:sticky;top:49px;z-index:55;background:var(--bg);border-bottom:1px solid var(--border);
  display:flex;gap:4px;padding:0 22px;overflow-x:auto;
}
.tab-btn{
  border:none;background:transparent;color:var(--muted);font-family:var(--font-body);font-weight:600;
  font-size:13.5px;padding:12px 16px;cursor:pointer;border-bottom:2.5px solid transparent;white-space:nowrap;
  display:flex;align-items:center;gap:7px;
}
.tab-btn .n{font-family:var(--font-mono);font-size:10.5px;background:var(--surface-2);border:1px solid var(--border);border-radius:5px;padding:1px 6px;color:var(--muted);}
.tab-btn:hover{color:var(--text);}
.tab-btn.active{color:var(--primary);border-bottom-color:var(--primary);}
.tab-btn.active .n{color:var(--primary);border-color:var(--primary-light);}

/* ============ PAGE / DOCUMENT ============ */
.page{max-width:1280px;margin:28px auto 90px;background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;border:1px solid var(--border);}

.hero{
  position:relative;padding:34px 40px 30px;color:#fff;
  background:linear-gradient(155deg,var(--primary) 0%,var(--primary-dark) 100%);
  overflow:hidden;
}
.hero::before{
  content:"";position:absolute;inset:0;opacity:.14;
  background-image:
    repeating-linear-gradient(0deg,transparent,transparent 27px,#fff 27px,#fff 28px),
    repeating-linear-gradient(90deg,transparent,transparent 27px,#fff 27px,#fff 28px);
}
.hero-top{position:relative;display:flex;align-items:center;gap:20px;}
.hero-meta{flex:1;min-width:0;}
.logo-slot{
  width:160px;height:96px;border-radius:16px;background:#fff;
  border:1px solid rgba(0,0,0,.08);box-shadow:0 6px 18px rgba(0,0,0,.22);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex:none;overflow:hidden;transition:.15s;padding:10px;
}
.logo-slot:hover{box-shadow:0 8px 24px rgba(0,0,0,.3);transform:translateY(-1px);}
.logo-slot img{width:100%;height:100%;object-fit:contain;}
.logo-slot svg{width:30px;height:30px;color:var(--muted);}
.eyebrow{
  font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:rgba(255,255,255,.78);outline:none;padding:2px 4px;border-radius:6px;
}
.title-field{
  font-family:var(--font-display);font-weight:700;font-size:32px;line-height:1.2;margin:4px 0 6px;
  outline:none;padding:2px 4px;border-radius:8px;
}
.subtitle-field{font-size:14px;color:rgba(255,255,255,.85);outline:none;padding:2px 4px;border-radius:6px;max-width:640px;}
[contenteditable]:hover{background:rgba(255,255,255,.08);}
[contenteditable]:focus{background:rgba(255,255,255,.14);box-shadow:0 0 0 2px rgba(255,255,255,.35);}
.hero-badges{position:relative;display:flex;gap:10px;margin-top:22px;flex-wrap:wrap;}
.badge{
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);border-radius:10px;
  padding:8px 12px;display:flex;flex-direction:column;gap:2px;min-width:110px;
}
.badge label{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:rgba(255,255,255,.7);}
.badge .val{font-family:var(--font-mono);font-size:13px;font-weight:500;background:transparent;border:none;color:#fff;outline:none;width:100%;}
.badge select.val{cursor:pointer;}
.badge .val option{color:#111;}

/* ============ TAB PANELS ============ */
.tab-panel{display:none;}
.tab-panel.active{display:block;}

.section{padding:30px 40px;border-bottom:1px solid var(--border);}
.section:last-child{border-bottom:none;}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:10px;flex-wrap:wrap;}
.section-title{font-family:var(--font-display);font-weight:600;font-size:16px;display:flex;align-items:center;gap:9px;}
.section-title .num{
  font-family:var(--font-mono);font-size:11px;color:var(--primary);background:var(--surface-2);
  border:1px solid var(--border);border-radius:6px;padding:2px 7px;
}
.section-actions{display:flex;gap:8px;flex-wrap:wrap;}
.meta-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.meta-item{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;}
.meta-item label{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px;}
.meta-item [contenteditable], .meta-item input{
  font-size:14px;font-weight:500;outline:none;border:none;background:transparent;width:100%;color:var(--text);font-family:var(--font-body);
}
.meta-item [contenteditable]:hover, .meta-item:hover{background:var(--surface);}
.meta-item [contenteditable]:focus{background:var(--surface);box-shadow:0 0 0 2px var(--primary-light);border-radius:6px;}

/* ---- phases / flight path timeline ---- */
.timeline{position:relative;padding:18px 6px 4px;}
.timeline-track{position:relative;display:flex;gap:0;overflow-x:auto;padding-bottom:6px;}
.phase{position:relative;flex:1;min-width:150px;padding:0 14px;}
.phase-line{position:absolute;top:15px;right:0;left:0;height:2px;background:repeating-linear-gradient(90deg,var(--border) 0 6px, transparent 6px 11px);}
.phase:first-child .phase-line{right:50%;}
.phase:last-child .phase-line{left:50%;}
.phase.done .phase-line{background:var(--good);}
.phase-node{
  width:32px;height:32px;border-radius:50%;background:var(--surface);border:2.5px solid var(--border);
  display:flex;align-items:center;justify-content:center;margin:0 auto;position:relative;z-index:2;
  font-family:var(--font-mono);font-size:12px;font-weight:600;color:var(--muted);
}
.phase.done .phase-node{background:var(--good);border-color:var(--good);color:#fff;}
.phase.active .phase-node{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 0 0 5px color-mix(in srgb, var(--primary) 20%, transparent);}
.phase-body{text-align:center;margin-top:10px;}
.phase-title{font-weight:600;font-size:13px;outline:none;border-radius:6px;padding:2px 4px;min-height:18px;}
.phase-date{font-size:11px;color:var(--muted);font-family:var(--font-mono);direction:ltr;border:none;background:transparent;text-align:center;width:100%;outline:none;margin-top:2px;}
.phase-status{font-size:11px;margin-top:5px;border:none;background:var(--surface-2);border-radius:999px;padding:2px 8px;color:var(--muted);cursor:pointer;font-family:var(--font-body);font-weight:600;}
.phase-del{position:absolute;top:-4px;left:6px;width:18px;height:18px;border-radius:50%;background:var(--surface);border:1px solid var(--border);color:var(--muted);font-size:11px;line-height:1;cursor:pointer;display:none;align-items:center;justify-content:center;}
.phase:hover .phase-del{display:flex;}
.add-phase{flex:none;width:110px;display:flex;align-items:center;justify-content:center;}
.add-phase button{width:32px;height:32px;border-radius:50%;border:1.5px dashed var(--border);background:transparent;color:var(--primary);cursor:pointer;font-size:16px;margin-top:0;}

/* ---- tables ---- */
.table-block{margin-bottom:22px;border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;}
.table-block-head{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--surface-2);}
.table-name{font-weight:700;font-size:13.5px;outline:none;border-radius:6px;padding:2px 6px;}
.tbl-wrap{overflow-x:auto;}
table.data{width:100%;border-collapse:collapse;font-size:13px;}
table.data th, table.data td{border:1px solid var(--border);padding:0;position:relative;}
table.data th{background:var(--surface-2);}
table.data th .cell, table.data td .cell{
  padding:8px 10px;outline:none;min-width:90px;display:block;font-weight:500;
}
table.data th .cell{font-weight:700;font-family:var(--font-display);font-size:12.5px;}
table.data tr:nth-child(even) td{background:color-mix(in srgb, var(--surface-2) 45%, transparent);}
.col-actions{display:flex;align-items:center;gap:4px;padding:4px 8px;justify-content:center;background:var(--surface-2);}
.mini-x{width:16px;height:16px;border-radius:50%;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:10px;line-height:1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;}
.mini-x:hover{border-color:var(--bad);color:var(--bad);}
.row-x{width:16px;height:16px;}
.tbl-footer{display:flex;gap:8px;padding:9px 12px;background:var(--surface);}
.tbl-footer .btn{padding:5px 11px;font-size:12px;}
.balloon-num{text-align:center;font-weight:700;color:var(--primary);font-family:var(--font-mono);}
.balloon-num.empty{color:var(--border);}
.status-select{width:100%;border:none;background:transparent;outline:none;font-family:var(--font-body);font-size:12.5px;font-weight:600;color:var(--text);padding:7px 8px;cursor:pointer;}
td.status-done{background:color-mix(in srgb, var(--good) 20%, var(--surface));}
td.status-done .status-select{color:var(--good);}
td.status-changereq{background:color-mix(in srgb, var(--bad) 18%, var(--surface));}
td.status-changereq .status-select{color:var(--bad);font-weight:700;}
.date-input-cell{width:100%;border:none;background:transparent;outline:none;font-family:var(--font-mono);font-size:12px;padding:7px 8px;color:var(--text);direction:ltr;text-align:right;}

/* ---- change-request modal ---- */
.modal-overlay{position:fixed;inset:0;background:rgba(10,16,24,.55);display:flex;align-items:center;justify-content:center;z-index:300;padding:20px;}
.modal-box{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;max-width:440px;width:100%;border:1px solid var(--border);}
.modal-box.help-box{max-width:640px;max-height:82vh;overflow-y:auto;}
.help-box h3{font-family:var(--font-display);font-size:14px;margin:16px 0 6px;}
.help-box h3:first-child{margin-top:0;}
.help-box p{font-size:13px;line-height:1.6;color:var(--text);margin:0 0 8px;}
.help-box ul{margin:0 0 8px;padding-inline-start:20px;}
.help-box li{font-size:13px;line-height:1.6;margin-bottom:4px;}
.modal-title{font-family:var(--font-display);font-weight:700;font-size:16px;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.modal-title::before{content:"⚠";color:var(--bad);}
.modal-context{font-size:12.5px;color:var(--muted);margin-bottom:14px;padding:9px 11px;background:var(--surface-2);border-radius:8px;border:1px solid var(--border);}
.modal-context-row{display:flex;justify-content:space-between;gap:12px;padding:3px 0;}
.modal-context-row .k{color:var(--muted);font-weight:600;flex:none;}
.modal-context-row .v{color:var(--text);font-weight:600;text-align:left;overflow-wrap:anywhere;}
.modal-label{font-size:12.5px;font-weight:600;margin-bottom:6px;color:var(--text);}
.modal-textarea{width:100%;min-height:90px;border:1px solid var(--border);border-radius:8px;padding:10px;font-family:var(--font-body);font-size:13px;resize:vertical;outline:none;background:var(--surface-2);box-sizing:border-box;}
.modal-textarea:focus{box-shadow:0 0 0 2px var(--primary-light);}
.modal-btn-row{display:flex;gap:10px;margin-top:16px;justify-content:flex-end;}
.modal-btn-row .btn{padding:9px 16px;}

/* ---- pdf orientation toggle ---- */
.pdf-orient-group{display:flex;align-items:center;gap:2px;border:1px solid var(--border);border-radius:999px;padding:2px;}
.pdf-orient-group button{border:none;background:transparent;padding:6px 10px;border-radius:999px;font-size:11.5px;font-weight:600;color:var(--muted);cursor:pointer;font-family:var(--font-body);}
.pdf-orient-group button.active{background:var(--primary);color:#fff;}

/* ---- images ---- */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;}
.img-card{border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;background:var(--surface);position:relative;display:flex;flex-direction:column;}
.img-card .tag{padding:7px 9px;font-size:12px;outline:none;min-height:16px;border-bottom:1px solid var(--border);background:var(--surface-2);color:var(--text);}
.img-card .tag:empty::before{content:attr(data-placeholder);color:var(--muted);}
.img-frame{position:relative;width:100%;height:150px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none;}
.img-frame img.thumb{max-width:100%;max-height:100%;object-fit:contain;display:block;}
.img-del{position:absolute;top:6px;left:6px;width:22px;height:22px;border-radius:50%;background:rgba(20,20,20,.55);color:#fff;border:none;cursor:pointer;font-size:12px;z-index:2;}
.add-img-card{border:1.5px dashed var(--border);border-radius:var(--radius-sm);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:190px;cursor:pointer;color:var(--muted);font-size:12px;font-weight:600;}
.add-img-card:hover{color:var(--primary);border-color:var(--primary-light);}

/* ---- notes ---- */
.note-row{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px;}
.note-num{width:24px;height:24px;border-radius:50%;background:var(--surface-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:11px;font-weight:700;color:var(--muted);flex:none;margin-top:3px;}
.note-text{flex:1;min-height:22px;outline:none;padding:9px 12px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13.5px;line-height:1.6;}
.note-text:focus{box-shadow:0 0 0 2px var(--primary-light);}
.note-del{flex:none;margin-top:4px;}
.note-add-btn{margin-top:4px;padding:8px 14px;font-size:12.5px;}
.notes-empty{color:var(--muted);font-size:13px;padding:10px 2px;}

.footer-note{padding:16px 40px 30px;font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between;}

/* ============ LAYOUT / PIN DIAGRAM ============ */
.layout-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.layout-tab-chip{
  border:1px solid var(--border);background:var(--surface-2);border-radius:999px;padding:6px 12px;font-size:12.5px;
  font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;color:var(--muted);
}
.layout-tab-chip.active{background:var(--primary);color:#fff;border-color:var(--primary);}
.layout-tab-chip .x{opacity:.7;font-size:11px;}
.layout-tab-chip .x:hover{opacity:1;}
.layout-tab-chip.add{border-style:dashed;color:var(--primary);background:transparent;}

.board-name{font-weight:700;font-family:var(--font-display);font-size:14px;outline:none;border-radius:6px;padding:3px 6px;margin-bottom:10px;display:inline-block;}

.layout-grid{display:flex;gap:0;align-items:flex-start;border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;}
@media (max-width:860px){.layout-grid{flex-direction:column;}}

.board-col{display:flex;flex-direction:column;background:var(--surface-2);min-width:220px;}
.panel-col{flex:1 1 auto;min-width:260px;background:var(--surface-2);border-inline-start:1px solid var(--border);display:flex;flex-direction:column;}
@media (max-width:860px){.board-col,.panel-col{flex:1 1 auto !important;border-inline-start:none;border-top:1px solid var(--border);}}

.resizer{width:10px;flex:none;align-self:stretch;cursor:col-resize;background:var(--surface-2);position:relative;display:flex;align-items:center;justify-content:center;}
.resizer::before{content:"";width:3px;height:44px;border-radius:3px;background:var(--border);}
.resizer:hover::before,.resizer.dragging::before{background:var(--primary);}
@media (max-width:860px){.resizer{display:none;}}

.board-toolbar{display:flex;gap:8px;margin:12px 12px 0;flex-wrap:wrap;align-items:center;}
.zoom-group{display:flex;align-items:center;gap:2px;border:1px solid var(--border);border-radius:999px;padding:2px;background:var(--surface);}
.zoom-group button{width:26px;height:26px;border-radius:50%;border:none;background:transparent;cursor:pointer;font-size:15px;font-weight:700;color:var(--text);display:flex;align-items:center;justify-content:center;line-height:1;}
.zoom-group button:hover{background:var(--surface-2);color:var(--primary);}
.zoom-val{font-family:var(--font-mono);font-size:11px;color:var(--muted);min-width:38px;text-align:center;}

.board-frame{
  position:relative;margin:12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);
  overflow:hidden;aspect-ratio:16/10;width:calc(100% - 24px);
  background-image:
    linear-gradient(var(--border) 1px, transparent 1px),
    linear-gradient(90deg, var(--border) 1px, transparent 1px);
  background-size:24px 24px;background-position:center;
}
.board-frame.add-mode{cursor:crosshair;outline:2px dashed var(--primary);outline-offset:-2px;}
.board-stage{position:absolute;inset:0;transform-origin:center center;transition:transform .12s ease;}
.board-stage img.bg{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;user-select:none;}
.board-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;text-align:center;padding:30px;}

.pin{
  position:absolute;width:28px;height:28px;border-radius:50%;background:var(--primary);color:#fff;
  display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-weight:700;font-size:12px;
  transform:translate(-50%,-50%);cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.35);border:2px solid #fff;
  transition:transform .1s;
}
.pin:hover{transform:translate(-50%,-50%) scale(1.12);}
.pin.selected{background:var(--accent);}
.pin.empty-items{background:var(--muted);}
.pin.locked{cursor:default;}
.pin.locked::after{
  content:"🔒";position:absolute;bottom:-5px;left:-5px;font-size:9px;line-height:1;
  background:var(--surface);border-radius:50%;padding:1.5px;box-shadow:0 1px 2px rgba(0,0,0,.3);
}

.pin-panel{padding:14px;display:flex;flex-direction:column;max-height:560px;overflow-y:auto;}
.pin-panel .ph{color:var(--muted);font-size:13px;text-align:center;padding:40px 10px;margin:auto;}
.pin-panel-head{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.pin-panel-head .badge-num{
  width:26px;height:26px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;
  justify-content:center;font-family:var(--font-mono);font-weight:700;font-size:12px;flex:none;
}
.pin-title{font-weight:700;font-size:14.5px;outline:none;border-radius:6px;padding:3px 6px;flex:1;min-width:100px;background:var(--surface);border:1px solid var(--border);}
.pin-del-btn{flex:none;}
.lock-toggle-btn{flex:none;font-size:12px;padding:7px 12px;}

.tree-head{display:grid;grid-template-columns:1fr 1.3fr 56px 22px 22px;gap:1.5px;background:var(--border);border:1px solid var(--border);border-radius:8px 8px 0 0;font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;overflow:hidden;}
.tree-head div{padding:7px 8px;background:var(--surface);}
.tree-wrap{border:1px solid var(--border);border-top:none;border-radius:0 0 8px 8px;background:var(--surface);padding:8px;}

.tree-node{margin-bottom:6px;}
.tree-row{display:grid;grid-template-columns:1fr 1.3fr 56px 22px 22px;gap:1.5px;background:var(--border);border:1px solid var(--border);border-inline-start-width:4px;border-radius:8px;overflow:hidden;}
.tree-row .cell{padding:6px 8px;font-size:12px;outline:none;display:flex;align-items:center;min-height:32px;box-sizing:border-box;background:var(--surface);}
.tree-row .cell.pn{font-family:var(--font-mono);font-weight:600;}
.tree-row .cell.ver{font-family:var(--font-mono);justify-content:center;}
.tree-row .cell:empty::before{content:"—";color:var(--border);}
.tree-row .tree-btn{display:flex;align-items:center;justify-content:center;background:var(--surface-2);cursor:pointer;color:var(--muted);font-size:13px;}
.tree-row .tree-btn:hover{color:var(--primary);}
.tree-row .tree-btn.del:hover{color:var(--bad);}
.tree-children{margin-inline-start:13px;padding-inline-start:13px;border-inline-start:1.5px dashed var(--border);margin-top:6px;}
.tree-add-root{width:100%;margin-top:8px;padding:7px;font-size:12.5px;}

/* hierarchy depth colours */
.tree-depth-0>.tree-row{border-inline-start-color:#0B5FA5;}
.tree-depth-0>.tree-row .cell{background:color-mix(in srgb,#0B5FA5 7%,var(--surface));}
.tree-depth-1>.tree-row{border-inline-start-color:#1E7A4C;}
.tree-depth-1>.tree-row .cell{background:color-mix(in srgb,#1E7A4C 8%,var(--surface));}
.tree-depth-2>.tree-row{border-inline-start-color:#6B3FC0;}
.tree-depth-2>.tree-row .cell{background:color-mix(in srgb,#6B3FC0 8%,var(--surface));}
.tree-depth-3>.tree-row{border-inline-start-color:#C0562F;}
.tree-depth-3>.tree-row .cell{background:color-mix(in srgb,#C0562F 7%,var(--surface));}

.tree-legend{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
.tree-legend-item{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--muted);}
.tree-legend-swatch{width:12px;height:20px;border-radius:3px;flex:none;}
.tree-legend-swatch.l0{background:#0B5FA5;}
.tree-legend-swatch.l1{background:#1E7A4C;}
.tree-legend-swatch.l2{background:#6B3FC0;}
.tree-legend-swatch.l3{background:#C0562F;}

/* ============ PRINT / PDF ============ */
@media print{
  body{background:#fff;}
  .toolbar, .tabs-bar, .no-print{display:none !important;}
  .page{box-shadow:none;border:none;margin:0;max-width:100%;border-radius:0;}
  .section{break-inside:avoid;padding:16px 26px;}
  .hero{padding:22px 26px;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  table.data{break-inside:avoid;}
  .phase-del,.mini-x,.img-del,.add-phase,.add-img-card,.tbl-footer,.col-actions,.layout-tabs .x{display:none !important;}
  [contenteditable]:hover, [contenteditable]:focus{background:transparent !important;box-shadow:none !important;}

  /* print-all mode: show every tab, stacked, each starting a new page */
  body.print-all .tab-panel{display:block !important;break-before:page;}
  body.print-all .tab-panel:first-of-type{break-before:auto;}
  body.print-all .print-tab-label{
    display:block !important;font-family:var(--font-display);font-weight:700;font-size:13px;
    color:var(--primary);text-transform:uppercase;letter-spacing:.06em;margin:0 40px 8px;padding-top:10px;
  }
  .print-tab-label{display:none;}
  body.print-all .layout-grid{display:block !important;}
  body.print-all .board-col, body.print-all .panel-col{flex:1 1 100% !important;width:100% !important;border-inline-start:none !important;}
  body.print-all .board-frame{min-height:320px;}
}
@page{size:A4;margin:14mm;}

/* responsive */
@media (max-width:720px){
  .meta-grid{grid-template-columns:1fr 1fr;}
  .section{padding:22px 18px;}
  .hero{padding:26px 20px;}
  .title-field{font-size:24px;}
  .tabs-bar{top:auto;}
}
</style>
</head>

<div class="toolbar no-print">
  <div class="brand">

    <span data-i18n="app_title">לוח ניהול פרויקט</span>
  </div>
  <button class="btn" id="btnNew"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg><span data-i18n="btn_new_project">פרויקט חדש</span></button>
  <button class="btn" id="btnExportJson"><span data-i18n="btn_save_project">שמירת קובץ פרויקט</span></button>
  <button class="btn" id="btnImportJson" data-i18n-title="import_btn_title" title="בוחרים קובץ פרויקט (JSON) לפתיחה"><span data-i18n="btn_load_project">טעינת קובץ פרויקט</span></button>
  <input type="file" id="fileImport" accept="application/json">
  <div class="autosave-group no-print">
    <button class="btn" id="btnAutoSave" data-mode="off" data-i18n-title="autosave_btn_title" title="שמירה אוטומטית לקובץ קבוע במחשב"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg><span data-i18n="btn_autosave_setup">הפעל שמירה אוטומטית</span></button>
    <select id="autoSaveInterval" class="btn" data-i18n-title="autosave_interval_title" title="תדירות שמירה">
      <option value="10" data-i18n="autosave_interval_10">כל 10 שנ'</option>
      <option value="20" selected data-i18n="autosave_interval_20">כל 20 שנ'</option>
      <option value="30" data-i18n="autosave_interval_30">כל 30 שנ'</option>
      <option value="60" data-i18n="autosave_interval_60">כל דקה</option>
      <option value="300" data-i18n="autosave_interval_300">כל 5 דקות</option>
    </select>
    <span id="autoSaveStatus" class="autosave-status"></span>
  </div>
  <button class="btn" id="btnExportExcel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4z"/><path d="M4 9h16M9 4v16"/></svg><span data-i18n="btn_export_excel">ייצוא Excel</span></button>
  <div class="pdf-orient-group no-print">
    <button class="btn-orient active" id="btnOrientPortrait" data-i18n="orient_portrait" data-i18n-title="orient_portrait">לאורך</button>
    <button class="btn-orient" id="btnOrientLandscape" data-i18n="orient_landscape" data-i18n-title="orient_landscape">לרוחב</button>
  </div>
  <button class="btn primary" id="btnPdf"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 21h16"/></svg><span data-i18n="btn_export_pdf">ייצוא PDF (כל הטאבים)</span></button>
  <div class="pdf-orient-group no-print">
    <button class="btn-orient" id="btnLangHe">עב</button>
    <button class="btn-orient" id="btnLangEn">En</button>
  </div>
  <button class="btn" id="btnHelp"><span data-i18n="btn_help">? עזרה</span></button>
  <div class="theme-row" id="themeRow"></div>
</div>

<div class="tabs-bar no-print" id="tabsBar"></div>

<div class="page" id="page">

  <div class="hero">
    <div class="hero-top">
      <div class="hero-meta">
        <div class="eyebrow" contenteditable="true" id="fCompany" data-bind="company">שם החברה</div>
        <div class="title-field" contenteditable="true" id="fTitle" data-bind="title">שם הפרויקט</div>
        <div class="subtitle-field" contenteditable="true" id="fSubtitle" data-bind="subtitle">תת-כותרת / תיאור קצר של הפרויקט</div>
      </div>
      <div class="logo-slot" id="logoSlot" title="לחץ להעלאת לוגו">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
      </div>
      <input type="file" id="logoFile" accept="image/*">
    </div>
    <div class="hero-badges">
      <div class="badge"><label data-i18n="badge_project_code">מס' פרויקט</label><input class="val ltr" id="fCode" data-bind="code" value="PRJ-0001"></div>
      <div class="badge"><label data-i18n="badge_version">גרסה</label><input class="val ltr" id="fVersion" data-bind="version" value="1.0"></div>
      <div class="badge"><label data-i18n="badge_update_date">תאריך עדכון</label><input class="val ltr" type="date" id="fDate" data-bind="date"></div>
      <div class="badge">
        <label data-i18n="badge_status">סטטוס</label>
        <select class="val" id="fStatus" data-bind="status">
          <option value="לא התחיל">לא התחיל</option>
          <option value="בתהליך">בתהליך</option>
          <option value="בהמתנה">בהמתנה</option>
          <option value="הושלם">הושלם</option>
        </select>
      </div>
    </div>
  </div>

  <!-- ===== TAB: OVERVIEW ===== -->
  <div class="tab-panel" data-tab="overview">
    <div class="print-tab-label" data-i18n="tab_overview">סקירה כללית</div>

      <div class="section-head"><div class="section-title"><span class="num">01</span><span data-i18n="section_01">פרטי הפרויקט</span></div></div>

    </div>
    <div class="section">
      <div class="section-head"><div class="section-title"><span class="num">02</span><span data-i18n="section_02">שלבי הפרויקט</span></div></div>
      <div class="timeline"><div class="timeline-track" id="timelineTrack"></div></div>
    </div>
  </div>

  <!-- ===== TAB: LAYOUT ===== -->
  <div class="tab-panel" data-tab="layout">

      <div class="section-head">
        <div class="section-title"><span class="num">03</span><span data-i18n="section_03">פריסה / רכיבים</span></div>
      </div>
      <div class="layout-tabs" id="layoutTabs"></div>
      <div id="layoutBoardWrap"></div>
    </div>
  </div>

      <div class="section-head">

      <div id="tablesWrap"></div>

function openHelpModal(){
  const overlay=document.createElement('div');
  overlay.className='modal-overlay no-print';
  const box=document.createElement('div');
  box.className='modal-box help-box';
  box.innerHTML=`
    <div class="modal-title">${t('help_title')}</div>
    ${HELP_BODY[currentLang] || HELP_BODY.he}
    <div class="modal-btn-row">
      <button class="btn primary help-close-btn">${t('help_close')}</button>
    </div>
  `;
  overlay.appendChild(box);
  document.body.appendChild(overlay);
  function close(){ overlay.remove(); }
  box.querySelector('.help-close-btn').addEventListener('click', close);
  overlay.addEventListener('mousedown',(e)=>{ if(e.target===overlay) close(); });
}


function applyStaticI18n(){
  document.documentElement.setAttribute('dir', currentLang==='he'?'rtl':'ltr');
  document.documentElement.setAttribute('lang', currentLang==='he'?'he':'en');
  const heBtn=document.getElementById('btnLangHe'), enBtn=document.getElementById('btnLangEn');
  if(heBtn) heBtn.classList.toggle('active', currentLang==='he');
  if(enBtn) enBtn.classList.toggle('active', currentLang==='en');
  document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent = t(el.getAttribute('data-i18n')); });
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>{ el.setAttribute('placeholder', t(el.getAttribute('data-i18n-ph'))); });
  document.querySelectorAll('[data-i18n-title]').forEach(el=>{ el.setAttribute('title', t(el.getAttribute('data-i18n-title'))); });
  document.querySelectorAll('#fStatus option').forEach(o=>{ o.textContent = heroStatusLabel(o.value); });
}
function translateIfDefault(value, keys, oldLang, newLang){
  for(let i=0;i<keys.length;i++){
    const k=keys[i];

}
function retranslateDefaults(oldLang, newLang){
  if(oldLang===newLang) return;
  const single=(k)=>[k];
  state.fields.company=translateIfDefault(state.fields.company, single('default_company'), oldLang, newLang);

  const phaseKeys=['default_phase_1','default_phase_2','default_phase_3','default_phase_4','default_phase_5','new_phase'];
  (state.phases||[]).forEach(p=>{ p.title=translateIfDefault(p.title, phaseKeys, oldLang, newLang); });
  const layoutKeys=['demo_layout_name','new_layout'];
  (state.layouts||[]).forEach(l=>{
    l.name=translateIfDefault(l.name, layoutKeys, oldLang, newLang);
    const oldPrefixNew=I18N[oldLang]['new_pin_prefix'], newPrefixNew=I18N[newLang]['new_pin_prefix'];
    const oldPrefixFallback=I18N[oldLang]['pin_fallback_prefix'], newPrefixFallback=I18N[newLang]['pin_fallback_prefix'];
    (l.pins||[]).forEach(p=>{
      if(!p.title) return;
      if(oldPrefixNew && p.title.indexOf(oldPrefixNew)===0){
        const rest=p.title.slice(oldPrefixNew.length);
        if(/^\d+$/.test(rest)) p.title=newPrefixNew+rest;
      } else if(oldPrefixFallback && p.title.indexOf(oldPrefixFallback)===0){
        const rest=p.title.slice(oldPrefixFallback.length);
        if(/^\d+$/.test(rest)) p.title=newPrefixFallback+rest;
      }
    });
  });
  const tableNameKeys=['default_items_table','new_table_name'];
  const colKeys=['col_balloon','col_pn','col_desc','col_rev','col_status','col_date','new_col_1','new_col_2','new_col_generic'];
  (state.tables||[]).forEach(tbl=>{
    tbl.name=translateIfDefault(tbl.name, tableNameKeys, oldLang, newLang);
    (tbl.columns||[]).forEach(col=>{ col.name=translateIfDefault(col.name, colKeys, oldLang, newLang); });
  });
}

/* ============================================================
   AUTO-SAVE TO A FIXED LOCAL FILE (File System Access API)
   Keeps overwriting the SAME file the user picked, every N sec,
   named after the Project No. at setup time. Survives page
   reloads (handle is kept in IndexedDB); a page reload still
   requires one click to re-grant permission (browser security).
   ============================================================ */
const AUTOSAVE_DB='pm_project_tracker_autosave', AUTOSAVE_STORE='handles', AUTOSAVE_KEY='fileHandle';
let autoSaveHandle=null, autoSaveTimer=null, autoSaveDirty=true, autoSaveBusy=false, autoSaveMode='off';
let autoSaveConnectedCode=null; // the מק"ט the connected file was set up for

function autoSaveSupported(){ return typeof window.showSaveFilePicker === 'function'; }

function idbOpen(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(AUTOSAVE_DB,1);
    req.onupgradeneeded=()=>{ req.result.createObjectStore(AUTOSAVE_STORE); };
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}
async function idbSetHandle(handle, code){
  try{
    const db=await idbOpen();
    await new Promise((res,rej)=>{
      const tx=db.transaction(AUTOSAVE_STORE,'readwrite');
      tx.objectStore(AUTOSAVE_STORE).put({handle, code: code||''}, AUTOSAVE_KEY);
      tx.oncomplete=res; tx.onerror=()=>rej(tx.error);
    });
  }catch(e){}
}
async function idbGetHandle(){
  try{
    const db=await idbOpen();
    const rec=await new Promise((res,rej)=>{
      const tx=db.transaction(AUTOSAVE_STORE,'readonly');
      const req=tx.objectStore(AUTOSAVE_STORE).get(AUTOSAVE_KEY);
      req.onsuccess=()=>res(req.result||null);
      req.onerror=()=>rej(req.error);
    });
    if(!rec) return null;
    // Back-compat: older saves stored the raw handle, not {handle, code}
    if(rec.handle) return rec;
    return {handle: rec, code: null};
  }catch(e){ return null; }
}
async function idbClearHandle(){
  try{
    const db=await idbOpen();
    await new Promise(res=>{
      const tx=db.transaction(AUTOSAVE_STORE,'readwrite');
      tx.objectStore(AUTOSAVE_STORE).delete(AUTOSAVE_KEY);
      tx.oncomplete=res; tx.onerror=res;
    });
  }catch(e){}
}

async function verifyRWPermission(handle){
  const opts={mode:'readwrite'};
  try{
    if((await handle.queryPermission(opts))==='granted') return true;
    if((await handle.requestPermission(opts))==='granted') return true;
  }catch(e){}
  return false;
}

function setAutoSaveStatus(text, isErr){

async function disconnectAutoSave(forgetRemembered){

  autoSaveTimer=null; autoSaveHandle=null; autoSaveConnectedCode=null;

function updateAutoSaveButton(mode){

  else if(mode==='reconnect') label.textContent=t('btn_autosave_reconnect');

function startAutoSaveTimer(){

}

async function writeAutoSaveFile(){
  if(!autoSaveHandle || autoSaveBusy || !autoSaveDirty) return;
  autoSaveBusy=true;
  try{
    const ok=await verifyRWPermission(autoSaveHandle);
    if(!ok){ updateAutoSaveButton('reconnect'); setAutoSaveStatus(t('autosave_status_error'), true); autoSaveBusy=false; return; }
    const writable=await autoSaveHandle.createWritable();
    await writable.write(JSON.stringify(state,null,2));
    await writable.close();
    autoSaveDirty=false;
    const now=new Date();
    setAutoSaveStatus(t('autosave_status_saved_prefix')+now.toLocaleTimeString(currentLang==='he'?'he-IL':'en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit'}));
  }catch(e){
    setAutoSaveStatus(t('autosave_status_error'), true);
  }
  autoSaveBusy=false;
}

async function setupAutoSave(){
  if(!autoSaveSupported()){ alert(t('alert_autosave_unsupported')); return; }
  if(autoSaveMode==='on'){
    if(confirm(t('confirm_autosave_stop'))){
      await disconnectAutoSave(true);
      setAutoSaveStatus('');
    }
    return;
  }
  if(autoSaveMode==='reconnect'){
    const rec=await idbGetHandle();
    if(rec && rec.handle){
      const ok=await verifyRWPermission(rec.handle);
      if(ok){
        autoSaveHandle=rec.handle; autoSaveConnectedCode=state.fields.code; autoSaveDirty=true;
        await idbSetHandle(rec.handle, state.fields.code);
        await writeAutoSaveFile();
        startAutoSaveTimer();
        updateAutoSaveButton('on');
        return;
      }
    }
  }
  try{
    const suggestedName=projectFileBaseName().replace(/ /g,'_')+'.json';
    const handle=await window.showSaveFilePicker({
      suggestedName,
      types:[{description:'JSON', accept:{'application/json':['.json']}}]
    });
    autoSaveHandle=handle;
    autoSaveConnectedCode=state.fields.code;
    await idbSetHandle(handle, state.fields.code);
    autoSaveDirty=true;
    await writeAutoSaveFile();
    startAutoSaveTimer();
    updateAutoSaveButton('on');
  }catch(e){ /* user cancelled the file picker */ }
}

async function initAutoSaveOnLoad(){
  if(!autoSaveSupported()){
    const btn=document.getElementById('btnAutoSave');
    if(btn){
      btn.disabled=true;
      btn.title=t('alert_autosave_unsupported');
      const label=btn.querySelector('span');
      if(label) label.textContent=t('btn_autosave_unsupported');
    }
    return;
  }
  const rec=await idbGetHandle();
  if(!rec || !rec.handle) return;
  // A remembered file that was set up for a different Project No. is a
  // different project as far as backups are concerned — don't silently
  // reconnect (or even offer a one-click reconnect) to the wrong file.
  // rec.code === null means an older save with no code recorded; treat as a match.
  if(rec.code!=null && rec.code!==state.fields.code){
    setAutoSaveStatus(t('autosave_status_code_mismatch'));
    return;
  }
  try{
    const perm=await rec.handle.queryPermission({mode:'readwrite'});
    if(perm==='granted'){
      autoSaveHandle=rec.handle; autoSaveConnectedCode=state.fields.code; autoSaveDirty=true;
      startAutoSaveTimer(); updateAutoSaveButton('on');
    } else {
      updateAutoSaveButton('reconnect');
    }
  }catch(e){
    updateAutoSaveButton('reconnect');
  }
}

function escapeHtml(s){

}

function findPinById(id){
  for(const l of state.layouts){
    const p=l.pins.find(x=>x.id===id);
    if(p) return {layout:l, pin:p};
  }
  return null;
}

function findNodeRec(list, id){
  for(const n of list){
    if(n.id===id) return n;
    const r=findNodeRec(n.children||[], id);
    if(r) return r;
  }
  return null;
}
function findNodeById(id){
  for(const l of state.layouts){
    for(const pin of l.pins){
      const nd=findNodeRec(pin.items, id);
      if(nd) return {layout:l, pin, node:nd};
    }
  }
  return null;
}

function collectPinNodeRows(layout){
  const list=[];
  layout.pins.forEach((pin,pinIdx)=>{
    const balloonNum=String(pinIdx+1);
    function walk(nodes, parentLabel, level){
      nodes.forEach((nd,idx)=>{
        let label;
        if(level===0){ label = idx===0? balloonNum : balloonNum+'-'+(idx+1); }
        else if(level%2===1){ label = parentLabel + LEVEL_LETTERS[idx%26]; }
        else { label = parentLabel + String(idx+1); }
        list.push({label, level, node:nd, pinId:pin.id});
        if(nd.children && nd.children.length) walk(nd.children, label, level+1);
      });
    }
    walk(pin.items, balloonNum, 0);
  });
  return list;
}

function reconcileBalloonTable(tbl){
  if(!tbl.balloonLinked) return;
  const layout = state.layouts.find(l=>l.id===tbl.linkedLayoutId) || state.layouts[0];
  if(!layout) return;
  const flat = collectPinNodeRows(layout);
  const nodeIds = flat.map(f=>f.node.id);
  tbl.rows = (tbl.rows||[]).filter(r=> !r.linkedNodeId || nodeIds.includes(r.linkedNodeId));
  const linkedRows = flat.map(f=>{
    let row = tbl.rows.find(r=>r.linkedNodeId===f.node.id);
    if(!row){ row={id:uid(), linkedNodeId:f.node.id, linkedPinId:f.pinId, cells:{}}; }
    row.cells[tbl.pnColId] = f.node.partNumber || '';
    row.cells[tbl.descColId] = f.node.description || '';
    if(tbl.revColId) row.cells[tbl.revColId] = f.node.version || '';
    row._label = f.label;
    row._level = f.level;
    return row;
  });
  const manualRows = tbl.rows.filter(r=>!r.linkedNodeId);
  tbl.rows = [...linkedRows, ...manualRows];
}

function syncPinToTables(pinId){
  state.tables.forEach(t=>{ if(t.balloonLinked) reconcileBalloonTable(t); });
  save();
  renderTables();
}

function renderTables(){

          sel.className='status-select';

            const o=document.createElement('option'); o.value=opt; o.textContent=statusLabel(opt);

          if(row.cells[col.id]==='נדרש שינוי') td.classList.add('status-changereq');
          sel.addEventListener('change',()=>{
            const prevValue = row.cells[col.id] || STATUS_OPTIONS[0];
            const newValue = sel.value;
            row.cells[col.id]=newValue; save();
            td.classList.toggle('status-done', newValue==='הושלם');
            td.classList.toggle('status-changereq', newValue==='נדרש שינוי');
            if(newValue==='נדרש שינוי' && prevValue!=='נדרש שינוי'){
              openChangeRequestModal(row, tbl, prevValue, sel, td);
            }
          });
          td.appendChild(sel);

        } else if(tbl.balloonLinked && col.id===tbl.dateColId){
          const inp=document.createElement('input');
          inp.type='date'; inp.className='date-input-cell';
          inp.value=row.cells[col.id]||'';
          inp.addEventListener('input',()=>{ row.cells[col.id]=inp.value; save(); });
          td.appendChild(inp);

        } else {
          const div=document.createElement('div');
          div.className='cell'; div.contentEditable='true'; div.textContent=row.cells[col.id]||'';
          const isLinkedTextCol = tbl.balloonLinked && row.linkedNodeId && (col.id===tbl.pnColId || col.id===tbl.descColId || col.id===tbl.revColId);
          if(isLinkedTextCol){
            td.classList.add('linked-cell');
            if(levelColor) div.style.background=`color-mix(in srgb, ${levelColor} 8%, var(--surface))`;
          }
          div.addEventListener('input',()=>{
            row.cells[col.id]=div.textContent; save();
            if(isLinkedTextCol){
              const info=findNodeById(row.linkedNodeId);
              if(info){
                if(col.id===tbl.pnColId) info.node.partNumber=div.textContent;
                if(col.id===tbl.descColId) info.node.description=div.textContent;
                if(col.id===tbl.revColId) info.node.version=div.textContent;
                save();
                renderLayoutBoard();

          td.appendChild(div);
        }

      } else {
        delTd.innerHTML=`<button class="mini-x row-x" title="${t('row_delete_title')}">×</button>`;
        delTd.querySelector('button').addEventListener('click',()=>{
          tbl.rows=tbl.rows.filter(r=>r.id!==row.id); save(); renderTables();
        });
      }
      tr.appendChild(delTd);
      table.appendChild(tr);
    });

    tblWrap.appendChild(table);
    block.appendChild(tblWrap);

    const footer=document.createElement('div');
    footer.className='tbl-footer no-print';
    footer.innerHTML=`<button class="btn">${t('btn_add_row')}</button>`;
    footer.querySelector('button').addEventListener('click',()=>{
      tbl.rows.push({id:uid(), cells:{}, linkedPinId:null}); save(); renderTables();
    });
    block.appendChild(footer);

    wrap.appendChild(block);
  });
}

function openChangeRequestModal(row, tbl, prevValue, selEl, td){
  let contextText='', contextHTML='';
  if(tbl.balloonLinked && row.linkedNodeId){
    const label = row._label || '';
    const pn = row.cells[tbl.pnColId] || '';
    const desc = row.cells[tbl.descColId] || '';
    contextText = [label?(t('modal_ctx_balloon')+' '+label):null, desc, pn].filter(Boolean).join(' · ');
    contextHTML = `
      <div class="modal-context-row"><span class="k">${t('modal_ctx_balloon')}</span><span class="v ltr">${escapeHtml(label||'—')}</span></div>
      <div class="modal-context-row"><span class="k">${t('modal_ctx_desc')}</span><span class="v">${escapeHtml(desc||'—')}</span></div>
      <div class="modal-context-row"><span class="k">${t('modal_ctx_pn')}</span><span class="v ltr">${escapeHtml(pn||'—')}</span></div>
    `;
  } else {
    contextText = row.cells[tbl.pnColId] || row.cells[tbl.descColId] || (tbl.name);
    contextHTML = `<div class="modal-context-row"><span class="v">${escapeHtml(contextText)}</span></div>`;
  }

  const overlay=document.createElement('div');
  overlay.className='modal-overlay no-print';

  const box=document.createElement('div');
  box.className='modal-box';
  box.innerHTML=`
    <div class="modal-title">${t('modal_title')}</div>
    <div class="modal-context">${contextHTML}</div>
    <div class="modal-label">${t('modal_label')}</div>
    <textarea class="modal-textarea" placeholder="${t('modal_placeholder')}"></textarea>
    <div class="modal-btn-row">
      <button class="btn danger reject-btn">${t('modal_reject')}</button>
      <button class="btn primary approve-btn">${t('modal_approve')}</button>
    </div>
  `;
  overlay.appendChild(box);
  document.body.appendChild(overlay);
  const textarea=box.querySelector('.modal-textarea');
  textarea.focus();

  function revert(){
    row.cells[tbl.statusColId]=prevValue; save();
    selEl.value=prevValue;
    td.classList.remove('status-changereq');
    td.classList.toggle('status-done', prevValue==='הושלם');
    overlay.remove();
  }
  box.querySelector('.reject-btn').addEventListener('click', revert);
  overlay.addEventListener('mousedown',(e)=>{ if(e.target===overlay) revert(); });

  box.querySelector('.approve-btn').addEventListener('click',()=>{
    const noteText=textarea.value.trim();
    const noteLine = noteText? `${t('note_change_req_prefix')}${contextText}: ${noteText}` : `${t('note_change_req_prefix')}${contextText}`;
    state.notesList.push({id:uid(), text:noteLine});
    save();
    renderNotes();
    overlay.remove();
  });
}

/* ============================================================
   IMAGES (gallery)
   ============================================================ */
function compressImage(file, maxDim, quality){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width, h=img.height;
        if(w>maxDim || h>maxDim){
          if(w>h){ h=Math.round(h*(maxDim/w)); w=maxDim; } else { w=Math.round(w*(maxDim/h)); h=maxDim; }
        }
        const canvas=document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        const ctx=canvas.getContext('2d');
        ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,w,h);
        ctx.drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror=reject;
      img.src=reader.result;
    };
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

   LAYOUT / PIN DIAGRAM (aircraft layout with per-motor cable hierarchy)

function activeLayout(){
  return state.layouts.find(l=>l.id===state.activeLayoutId) || state.layouts[0];
}

function renderLayoutTabs(){
  const wrap=document.getElementById('layoutTabs');
  wrap.innerHTML='';
  state.layouts.forEach(l=>{
    const chip=document.createElement('div');
    chip.className='layout-tab-chip no-print'+(l.id===state.activeLayoutId?' active':'');
    chip.innerHTML=`<span class="chip-label">${escapeHtml(l.name)}</span>` + (state.layouts.length>1?`<span class="x" title="${t('layout_delete_tooltip')}">×</span>`:'');
    const labelEl=chip.querySelector('.chip-label');
    labelEl.addEventListener('click',()=>{
      if(labelEl.isContentEditable) return;
      state.activeLayoutId=l.id; selectedPinId=null; save(); renderLayoutBoard(); renderLayoutTabs();
    });
    labelEl.addEventListener('dblclick',(e)=>{
      e.stopPropagation();
      labelEl.contentEditable='true';
      labelEl.focus();
      document.execCommand('selectAll',false,null);
    });
    labelEl.addEventListener('blur',()=>{
      labelEl.contentEditable='false';
      l.name=labelEl.textContent.trim()||t('new_layout'); save(); renderLayoutTabs();
    });
    labelEl.addEventListener('keydown',(e)=>{ if(e.key==='Enter'){ e.preventDefault(); labelEl.blur(); } });
    const xEl=chip.querySelector('.x');
    if(xEl) xEl.addEventListener('click',(e)=>{
      e.stopPropagation();
      if(!confirm(t('layout_delete_confirm_prefix')+l.name+t('layout_delete_confirm_suffix'))) return;
      state.layouts=state.layouts.filter(x=>x.id!==l.id);
      if(state.activeLayoutId===l.id) state.activeLayoutId=state.layouts[0].id;
      save(); renderLayoutTabs(); renderLayoutBoard();
    });
    wrap.appendChild(chip);
  });
  const addChip=document.createElement('div');
  addChip.className='layout-tab-chip add no-print';
  addChip.innerHTML=`<span>${t('layout_new_chip')}</span>`;
  addChip.addEventListener('click',()=>{
    const nl={id:uid(), name:t('new_layout'), image:null, zoom:1, pins:[]};
    state.layouts.push(nl); state.activeLayoutId=nl.id;
    save(); renderLayoutTabs(); renderLayoutBoard();
  });
  wrap.appendChild(addChip);
}

function renderLayoutBoard(){
  const wrap=document.getElementById('layoutBoardWrap');
  const layout=activeLayout();
  if(!layout){ wrap.innerHTML=''; return; }
  wrap.innerHTML='';

  const nameEl=document.createElement('div');
  nameEl.className='board-name';
  nameEl.contentEditable='true';
  nameEl.textContent=layout.name;
  nameEl.addEventListener('input',()=>{ layout.name=nameEl.textContent; save(); renderLayoutTabs(); });
  wrap.appendChild(nameEl);

  const toolbar=document.createElement('div');
  toolbar.className='board-toolbar no-print';
  toolbar.innerHTML=`
    <button class="btn" id="btnUploadBoardImg">${layout.image? t('board_replace_bg'):t('board_upload_bg')}</button>
    ${layout.image? `<button class="btn danger" id="btnDelBoardImg">${t('board_delete_bg')}</button>`:''}
    <button class="btn ${addPinMode?'active':''}" id="btnAddPin">${addPinMode? t('board_cancel_add'):t('board_add_pin')}</button>
    <div class="zoom-group">
      <button id="zoomOut" title="${t('zoom_out_title')}">–</button>
      <span class="zoom-val">${Math.round((layout.zoom||1)*100)}%</span>
      <button id="zoomReset" title="${t('zoom_reset_title')}">⟳</button>
      <button id="zoomIn" title="${t('zoom_in_title')}">+</button>
    </div>
    <input type="file" id="boardImgFile" accept="image/*">
  `;
  wrap.appendChild(toolbar);
  toolbar.querySelector('#btnUploadBoardImg').addEventListener('click',()=>toolbar.querySelector('#boardImgFile').click());
  toolbar.querySelector('#boardImgFile').addEventListener('change',e=>{
    const f=e.target.files[0]; if(!f) return;
    compressImage(f, 1600, 0.8).then(dataUrl=>{ layout.image=dataUrl; layout.zoom=1; save(); renderLayoutBoard(); });
  });
  const delImgBtn=toolbar.querySelector('#btnDelBoardImg');
  if(delImgBtn) delImgBtn.addEventListener('click',()=>{
    if(!confirm(t('board_delete_bg_confirm'))) return;
    layout.image=null;
    if(layout.pins && layout.pins.length && confirm(t('board_delete_pins_confirm'))){
      layout.pins=[];
      selectedPinId=null;
    }
    save(); renderLayoutBoard();
  });
  toolbar.querySelector('#btnAddPin').addEventListener('click',()=>{ addPinMode=!addPinMode; renderLayoutBoard(); });
  toolbar.querySelector('#zoomIn').addEventListener('click',()=>{ layout.zoom=Math.min(3,(layout.zoom||1)+0.15); save(); renderLayoutBoard(); });
  toolbar.querySelector('#zoomOut').addEventListener('click',()=>{ layout.zoom=Math.max(0.4,(layout.zoom||1)-0.15); save(); renderLayoutBoard(); });
  toolbar.querySelector('#zoomReset').addEventListener('click',()=>{ layout.zoom=1; save(); renderLayoutBoard(); });

  const grid=document.createElement('div');
  grid.className='layout-grid';

  const boardCol=document.createElement('div');
  boardCol.className='board-col';
  boardCol.style.flex=`0 0 ${state.layoutSplit||62}%`;

  const frame=document.createElement('div');
  frame.className='board-frame'+(addPinMode?' add-mode':'');

  const stage=document.createElement('div');
  stage.className='board-stage';
  stage.style.transform=`scale(${layout.zoom||1})`;

  if(layout.image){
    const img=document.createElement('img');
    img.className='bg'; img.src=layout.image;
    stage.appendChild(img);
  }

  layout.pins.forEach((pin,idx)=>{
    const p=document.createElement('div');
    p.className='pin'+(pin.id===selectedPinId?' selected':'')+((!pin.items||pin.items.length===0)?' empty-items':'')+(pin.locked?' locked':'');
    p.style.left=pin.x+'%'; p.style.top=pin.y+'%';
    p.textContent=idx+1;
    p.title=(pin.title||(t('pin_fallback_prefix')+(idx+1)))+(pin.locked? t('pin_locked_hint'):t('pin_drag_hint'));

    p.addEventListener('click',(e)=>{ e.stopPropagation(); });
    p.addEventListener('mousedown',(e)=>{
      e.stopPropagation();
      e.preventDefault();
      if(pin.locked){
        selectedPinId = (selectedPinId===pin.id)? null : pin.id;
        renderLayoutBoard();
        return;
      }
      const startX=e.clientX, startY=e.clientY;
      let moved=false;
      function onMove(ev){
        const dx=ev.clientX-startX, dy=ev.clientY-startY;
        if(Math.abs(dx)>4 || Math.abs(dy)>4) moved=true;
        if(moved){
          const stageRect=stage.getBoundingClientRect();
          let nx=((ev.clientX-stageRect.left)/stageRect.width)*100;
          let ny=((ev.clientY-stageRect.top)/stageRect.height)*100;
          nx=Math.max(2,Math.min(98,nx)); ny=Math.max(2,Math.min(98,ny));
          pin.x=nx; pin.y=ny;
          p.style.left=nx+'%'; p.style.top=ny+'%';
        }
      }
      function onUp(){
        document.removeEventListener('mousemove',onMove);
        document.removeEventListener('mouseup',onUp);
        if(moved){ save(); }
        else {
          selectedPinId = (selectedPinId===pin.id)? null : pin.id;
          renderLayoutBoard();
        }
      }
      document.addEventListener('mousemove',onMove);
      document.addEventListener('mouseup',onUp);
    });
    stage.appendChild(p);
  });

  frame.appendChild(stage);

  if(!layout.image){
    const empty=document.createElement('div');
    empty.className='board-empty no-print';
    empty.innerHTML=t('board_empty_html');
    frame.appendChild(empty);
  }

  stage.addEventListener('click',(e)=>{
    if(!addPinMode) return;
    if(e.target.classList.contains('pin')) return;
    const rect=stage.getBoundingClientRect();
    const x=((e.clientX-rect.left)/rect.width)*100;
    const y=((e.clientY-rect.top)/rect.height)*100;
    const np={id:uid(), x:Math.max(2,Math.min(98,x)), y:Math.max(2,Math.min(98,y)), title:t('new_pin_prefix')+(layout.pins.length+1), items:[]};
    layout.pins.push(np);
    selectedPinId=np.id;
    addPinMode=false;
    save(); renderLayoutBoard();
  });

  frame.addEventListener('wheel',(e)=>{
    e.preventDefault();
    const delta = e.deltaY<0? 0.08 : -0.08;
    layout.zoom = Math.max(0.4, Math.min(3, (layout.zoom||1)+delta));
    stage.style.transform = `scale(${layout.zoom})`;
    const zv=toolbar.querySelector('.zoom-val');
    if(zv) zv.textContent = Math.round(layout.zoom*100)+'%';
    save();
  }, {passive:false});

  boardCol.appendChild(frame);
  grid.appendChild(boardCol);

  const resizer=document.createElement('div');
  resizer.className='resizer no-print';
  resizer.title=t('resizer_title');
  grid.appendChild(resizer);

  const panelCol=document.createElement('div');
  panelCol.className='panel-col';

  const panel=document.createElement('div');
  panel.className='pin-panel';
  const pin = layout.pins.find(p=>p.id===selectedPinId);
  if(!pin){
    panel.innerHTML=`<div class="ph">${t('pin_panel_placeholder')}</div>`;
  } else {
    const idx=layout.pins.indexOf(pin);
    const head=document.createElement('div');
    head.className='pin-panel-head';
    head.innerHTML=`<div class="badge-num">${idx+1}</div>
      <div class="pin-title" contenteditable="true">${escapeHtml(pin.title)}</div>
      <button class="btn lock-toggle-btn no-print" title="${pin.locked? t('pin_unlock_title'):t('pin_lock_title')}">${pin.locked? t('pin_unlock_btn'):t('pin_lock_btn')}</button>
      <button class="btn danger pin-del-btn no-print" title="${t('pin_delete_btn')}">${t('pin_delete_btn')}</button>`;
    head.querySelector('.pin-title').addEventListener('input',e=>{ pin.title=e.target.textContent; save(); });
    head.querySelector('.lock-toggle-btn').addEventListener('click',()=>{
      pin.locked=!pin.locked; save(); renderLayoutBoard();
    });
    head.querySelector('.pin-del-btn').addEventListener('click',()=>{
      layout.pins=layout.pins.filter(x=>x.id!==pin.id);
      selectedPinId=null;
      syncPinToTables(pin.id);
      renderLayoutBoard();
    });
    panel.appendChild(head);

    const theadEl=document.createElement('div');
    theadEl.className='tree-head';
    theadEl.innerHTML=`<div>${t('tree_col_pn')}</div><div>${t('tree_col_desc')}</div><div>${t('tree_col_ver')}</div><div></div><div></div>`;

    const legendEl=document.createElement('div');
    legendEl.className='tree-legend';
    legendEl.innerHTML=`
      <div class="tree-legend-item"><span class="tree-legend-swatch l0"></span>${t('legend_parent')}</div>
      <div class="tree-legend-item"><span class="tree-legend-swatch l1"></span>${t('legend_child')}</div>
      <div class="tree-legend-item"><span class="tree-legend-swatch l2"></span>${t('legend_grandchild')}</div>
    `;
    panel.appendChild(legendEl);
    panel.appendChild(theadEl);

    const treeWrapEl=document.createElement('div');
    treeWrapEl.className='tree-wrap';
    if(pin.items.length===0){
      const ph=document.createElement('div');
      ph.style.cssText='color:var(--muted);font-size:12px;padding:10px;text-align:center;';
      ph.textContent=t('tree_empty');
      treeWrapEl.appendChild(ph);
    } else {
      renderItemsTree(treeWrapEl, pin.items, pin, 0);
    }
    panel.appendChild(treeWrapEl);

    const addRootBtn=document.createElement('button');
    addRootBtn.className='btn tree-add-root no-print';
    addRootBtn.textContent=t('tree_add_root');
    addRootBtn.addEventListener('click',()=>{
      pin.items.push({id:uid(),partNumber:'',description:'',version:'',children:[]});
      syncPinToTables(pin.id);
      renderLayoutBoard();
    });
    panel.appendChild(addRootBtn);
  }
  panelCol.appendChild(panel);
  grid.appendChild(panelCol);

  wrap.appendChild(grid);

  attachResizer(resizer, grid, boardCol);
}

function renderItemsTree(container, nodes, pin, level){
  level = level||0;
  const depthClass = 'tree-depth-'+Math.min(level,3);
  nodes.forEach(nd=>{
    const nodeEl=document.createElement('div');
    nodeEl.className='tree-node '+depthClass;

    const row=document.createElement('div');
    row.className='tree-row';
    row.innerHTML=`
      <div class="cell pn ltr" contenteditable="true">${escapeHtml(nd.partNumber)}</div>
      <div class="cell desc" contenteditable="true">${escapeHtml(nd.description)}</div>
      <div class="cell ver ltr" contenteditable="true">${escapeHtml(nd.version)}</div>
      <div class="tree-btn add no-print" title="${t('tree_add_child_title')}">+</div>
      <div class="tree-btn del no-print" title="${t('tree_del_item_title')}">×</div>
    `;
    const cells=row.querySelectorAll('.cell');
    cells[0].addEventListener('input',e=>{ nd.partNumber=e.target.textContent; save(); syncPinToTables(pin.id); });
    cells[1].addEventListener('input',e=>{ nd.description=e.target.textContent; save(); syncPinToTables(pin.id); });
    cells[2].addEventListener('input',e=>{ nd.version=e.target.textContent; save(); syncPinToTables(pin.id); });
    row.querySelector('.add').addEventListener('click',()=>{
      nd.children.push({id:uid(),partNumber:'',description:'',version:'',children:[]});
      syncPinToTables(pin.id);
      renderLayoutBoard();
    });
    row.querySelector('.del').addEventListener('click',()=>{
      deleteNodeRec(pin.items, nd.id);
      syncPinToTables(pin.id);
      renderLayoutBoard();
    });
    nodeEl.appendChild(row);

    if(nd.children && nd.children.length){
      const childrenWrap=document.createElement('div');
      childrenWrap.className='tree-children';
      renderItemsTree(childrenWrap, nd.children, pin, level+1);
      nodeEl.appendChild(childrenWrap);
    }
    container.appendChild(nodeEl);
  });
}

function deleteNodeRec(list, id){
  const idx=list.findIndex(n=>n.id===id);
  if(idx>-1){ list.splice(idx,1); return true; }
  for(const n of list){ if(deleteNodeRec(n.children, id)) return true; }
  return false;
}

/* ============================================================
   NOTES (numbered lines)
   ============================================================ */
function renderNotes(){
  const wrap=document.getElementById('notesWrap');
  wrap.innerHTML='';
  if(!state.notesList.length){
    const ph=document.createElement('div');
    ph.className='notes-empty';
    ph.textContent=t('notes_empty');
    wrap.appendChild(ph);
  }
  state.notesList.forEach((note,idx)=>{
    const row=document.createElement('div');
    row.className='note-row';
    row.innerHTML=`
      <div class="note-num">${idx+1}</div>
      <div class="note-text" contenteditable="true">${escapeHtml(note.text)}</div>
      <button class="mini-x note-del no-print" title="${t('note_delete_title')}">×</button>`;
    row.querySelector('.note-text').addEventListener('input',e=>{ note.text=e.target.textContent; save(); });
    row.querySelector('.note-del').addEventListener('click',()=>{
      state.notesList=state.notesList.filter(n=>n.id!==note.id); save(); renderNotes();
    });
    wrap.appendChild(row);
  });
  const addBtn=document.createElement('button');
  addBtn.className='btn note-add-btn no-print';
  addBtn.textContent=t('notes_add');
  addBtn.addEventListener('click',()=>{
    state.notesList.push({id:uid(), text:''});
    save(); renderNotes();
    const rows=wrap.querySelectorAll('.note-text');
    if(rows.length) rows[rows.length-1].focus();
  });
  wrap.appendChild(addBtn);
}

function attachResizer(resizer, grid, boardCol){
  resizer.addEventListener('mousedown', (e)=>{
    e.preventDefault();
    resizer.classList.add('dragging');
    document.body.style.userSelect='none';
    const rect=grid.getBoundingClientRect();
    function onMove(ev){
      const boardWidthPx = rect.right - ev.clientX;
      let pct=(boardWidthPx/rect.width)*100;
      pct=Math.max(30,Math.min(75,pct));
      state.layoutSplit=pct;
      boardCol.style.flex=`0 0 ${pct}%`;
    }
    function onUp(){
      resizer.classList.remove('dragging');
      document.body.style.userSelect='';
      document.removeEventListener('mousemove',onMove);
      document.removeEventListener('mouseup',onUp);
      save();
    }
    document.addEventListener('mousemove',onMove);
    document.addEventListener('mouseup',onUp);
  });
}

/* ============================================================
   HISTORY LOG
   ============================================================ */
function renderHistory(){
  const wrap=document.getElementById('historyWrap');
  wrap.innerHTML='';
  const block=document.createElement('div');
  block.className='table-block';
  const tblWrap=document.createElement('div');
  tblWrap.className='tbl-wrap';
  const table=document.createElement('table');
  table.className='data hist';
  const headRow=document.createElement('tr');
  [t('hist_col_version'),t('hist_col_date'),t('hist_col_author'),t('hist_col_change')].forEach(h=>{
    const th=document.createElement('th');
    th.innerHTML=`<div class="cell">${h}</div>`;
    headRow.appendChild(th);
  });
  const sp=document.createElement('th'); sp.className='no-print'; headRow.appendChild(sp);
  table.appendChild(headRow);

  state.history.forEach(h=>{
    const tr=document.createElement('tr');
    const c1=document.createElement('td'); c1.innerHTML=`<div class="cell ltr" contenteditable="true">${escapeHtml(h.version)}</div>`;
    c1.querySelector('div').addEventListener('input',e=>{h.version=e.target.textContent;save();});
    const c2=document.createElement('td'); c2.innerHTML=`<div class="cell ltr" contenteditable="true">${escapeHtml(h.date)}</div>`;
    c2.querySelector('div').addEventListener('input',e=>{h.date=e.target.textContent;save();});
    const c3=document.createElement('td'); c3.innerHTML=`<div class="cell" contenteditable="true">${escapeHtml(h.author)}</div>`;
    c3.querySelector('div').addEventListener('input',e=>{h.author=e.target.textContent;save();});
    const c4=document.createElement('td'); c4.innerHTML=`<div class="cell" contenteditable="true">${escapeHtml(h.change)}</div>`;
    c4.querySelector('div').addEventListener('input',e=>{h.change=e.target.textContent;save();});
    const c5=document.createElement('td'); c5.className='no-print'; c5.style.textAlign='center';
    c5.innerHTML=`<button class="mini-x row-x" title="${t('hist_delete_title')}">×</button>`;
    c5.querySelector('button').addEventListener('click',()=>{ state.history=state.history.filter(x=>x.id!==h.id); save(); renderHistory(); });
    tr.append(c1,c2,c3,c4,c5);
    table.appendChild(tr);
  });
  tblWrap.appendChild(table);
  block.appendChild(tblWrap);

  const footer=document.createElement('div');
  footer.className='tbl-footer no-print';
  footer.innerHTML=`<button class="btn">${t('hist_add')}</button>`;
  footer.querySelector('button').addEventListener('click',()=>{
    state.history.push({id:uid(), version:state.fields.version||'', date:new Date().toISOString().slice(0,10), author:'', change:''});
    save(); renderHistory();
  });
  block.appendChild(footer);
  wrap.appendChild(block);
}

/* Shared by both load paths below: applies parsed project JSON to the app. */
function applyLoadedProjectData(data){
  state=Object.assign(defaultState(), data);
  migrateState();
  state.activeLayoutId = state.layouts[0].id;
  save(); fullRender();
}

/* Loads a project from a FileSystemFileHandle (from the "open file" picker)
   and — since we already hold a real handle to it — also reconnects
   auto-save so it keeps writing right back into that same file. */
async function loadProjectFromHandle(handle){
  try{
    const file=await handle.getFile();
    const text=await file.text();
    const data=JSON.parse(text);
    applyLoadedProjectData(data);
  }catch(err){ alert(t('alert_invalid_file')); return; }
  const ok=await verifyRWPermission(handle);
  if(ok){
    autoSaveHandle=handle;
    autoSaveConnectedCode=state.fields.code;
    await idbSetHandle(handle, state.fields.code);
    autoSaveDirty=false;
    startAutoSaveTimer();
    updateAutoSaveButton('on');
    setAutoSaveStatus(t('autosave_status_connected'));
  }
}

document.getElementById('btnImportJson').addEventListener('click', async ()=>{
  if(typeof window.showOpenFilePicker === 'function'){
    try{
      const [handle]=await window.showOpenFilePicker({
        types:[{description:'JSON', accept:{'application/json':['.json']}}],
        multiple:false
      });
      await loadProjectFromHandle(handle);
    }catch(e){ /* user cancelled the picker */ }
  } else {
    document.getElementById('fileImport').click();
  }
});
document.getElementById('fileImport').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const data=JSON.parse(r.result);
      applyLoadedProjectData(data);
    }catch(err){ alert(t('alert_invalid_file')); }
  };
  r.readAsText(f);
  e.target.value='';
});

  if(printOrientation==='landscape'){
    if(!styleEl){ styleEl=document.createElement('style'); styleEl.id='dynamicPageStyle'; document.head.appendChild(styleEl); }
    styleEl.textContent='@page{size:A4 landscape;margin:14mm;}';

/* --- Excel export: mirrors the same balloon/hierarchy structure as the tables --- */
function buildWorkbook(){
  state.tables.forEach(t=>{ if(t.balloonLinked) reconcileBalloonTable(t); });
  const wb=XLSX.utils.book_new();
  state.tables.forEach(tbl=>{
    const headers=tbl.columns.map(c=>c.name);
    const aoa=[headers];
    tbl.rows.forEach(row=>{
      const line=tbl.columns.map(col=>{
        if(tbl.balloonLinked && col.id===tbl.balloonColId){
          return row.linkedNodeId? (row._label||'') : '';
        }
        let val=row.cells[col.id]||'';
        if(tbl.balloonLinked && col.id===tbl.descColId && row.linkedNodeId){
          val='   '.repeat(row._level||0)+val;
        }
        return val;
      });
      aoa.push(line);
    });
    const ws=XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols']=tbl.columns.map(c=>({wch:Math.max(12,Math.min(42,(c.name||'').length+8))}));
    let sheetName=(tbl.name||'טבלה').replace(/[\\/*?:\[\]]/g,' ').slice(0,31).trim() || 'Sheet';
    XLSX.utils.book_append_sheet(wb, ws, sheetName);
  });
  return wb;
}
document.getElementById('btnExportExcel').addEventListener('click',()=>{
  if(typeof XLSX==='undefined'){ alert(t('alert_excel_not_loaded')); return; }
  try{
    const wb=buildWorkbook();
    const name=projectFileBaseName();
    XLSX.writeFile(wb, name+'.xlsx');
    renderTables();
  }catch(err){
    alert(t('alert_excel_error'));
  }
});
